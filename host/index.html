<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المقدم - حروف مع مراح</title>
    <style>
        @font-face {
            font-family: 'AA-GALAXY';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXY.otf');
        }
        @font-face {
            font-family: 'AA-GALAXY-BOLD';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXYBold.otf');
        }
        :root {
            --team1-color: #2ecc00;
            --team2-color: #ff6d00;
        }
        * {
            font-family: 'AA-GALAXY-BOLD', 'AA-GALAXY', sans-serif !important;
            box-sizing: border-box; margin: 0; padding: 0;
        }

        html, body {
            overflow: auto;
            height: auto;
        }

        body {
            background: #6a3093;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            gap: 15px;
            position: relative;
        }

        /* Hex Background */
        .hex-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #6a3093;
            overflow: hidden;
            z-index: 0;
        }
        .hex-bg svg {
            width: 100%;
            height: 100%;
            opacity: 0.18;
        }

        /* Fullscreen Button */
        .fullscreen-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 1000;
            width: 40px;
            height: 40px;
            background: rgba(44, 27, 77, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .fullscreen-btn:hover {
            background: rgba(44, 27, 77, 0.9);
            transform: scale(1.05);
        }
        .fullscreen-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Content Container */
        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
            padding-bottom: 15px;
        }

        /* Logo Stack */
        .logo-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
            pointer-events: none;
        }
        .logo-word {
            font-weight: 900;
            text-align: center;
            display: inline-block;
        }

        .logo-huroof {
            color: #fdd835;
            font-size: clamp(40px, 7vw, 70px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 6px 6px 0 #2c1b4d,
                7px 7px 0 #2c1b4d, 8px 8px 0 #2c1b4d, 10px 10px 15px rgba(0,0,0,0.6);
            animation: floatUp 4s ease-in-out infinite, glow-yellow 4s ease-in-out infinite;
        }
        .logo-ma {
            color: #26c6da;
            font-size: clamp(30px, 5vw, 55px);
            letter-spacing: clamp(8px, 1.5vw, 15px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 7px 7px 15px rgba(0,0,0,0.6);
            animation: floatUpMa 4s ease-in-out 0.5s infinite, glow-cyan 4s ease-in-out 0.5s infinite;
        }
        .logo-marah {
            color: #ef5350;
            font-size: clamp(40px, 7vw, 70px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 6px 6px 0 #2c1b4d,
                7px 7px 0 #2c1b4d, 8px 8px 0 #2c1b4d, 10px 10px 15px rgba(0,0,0,0.6);
            animation: floatUp 4s ease-in-out 1s infinite, glow-red 4s ease-in-out 1s infinite;
        }

        .presenter-label {
            color: white;
            font-size: clamp(18px, 3vw, 28px);
            font-weight: 900;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            margin-top: 5px;
        }

        /* Score Section */
        .score-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(20px, 5vw, 50px);
            width: 100%;
        }

        .score-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .team-label {
            font-size: clamp(14px, 2.5vw, 22px);
            font-weight: 900;
            text-align: center;
            max-width: clamp(80px, 12vw, 130px);
            word-break: break-word;
        }

        .team-label.green { color: var(--team1-color); }
        .team-label.orange { color: var(--team2-color); }

        .score-box {
            width: clamp(55px, 10vw, 90px);
            height: clamp(55px, 10vw, 90px);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 900;
            color: white;
            border-radius: clamp(12px, 2vw, 20px);
        }

        .green-score {
            background: var(--team1-color);
            box-shadow: 0 4px 15px rgba(46, 204, 0, 0.4);
        }
        .orange-score {
            background: var(--team2-color);
            box-shadow: 0 4px 15px rgba(255, 109, 0, 0.4);
        }

        /* Hex Board */
        .hex-board {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: conic-gradient(from 45deg, var(--team1-color) 90deg, var(--team2-color) 90deg 180deg, var(--team1-color) 180deg 270deg, var(--team2-color) 270deg);
            border-radius: 20px;
            padding: 20px;
            overflow: visible;
        }

        .hex-board svg {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: visible;
        }

        .hexagon {
            cursor: pointer;
        }
        .hex-poly {
            stroke: #6a3093;
            stroke-width: 6;
            stroke-linejoin: round;
            fill: white;
            transition: fill 0.3s;
        }
        .hex-text {
            font-size: clamp(24px, 4vw, 38px);
            font-weight: 900;
            fill: #6a3093;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: central;
        }

        /* Pending state - yellow glow */
        .pending-fill .hex-poly {
            fill: #fdd835 !important;
        }
        .pending-fill .hex-text {
            fill: #2c1b4d !important;
        }

        /* Team fills */
        .green-fill .hex-poly { fill: var(--team1-color) !important; }
        .orange-fill .hex-poly { fill: var(--team2-color) !important; }
        .green-fill .hex-text,
        .orange-fill .hex-text { fill: white !important; }

        /* Control Panel */
        .control-panel {
            background: #2c1b4d;
            border-radius: 20px;
            padding: clamp(15px, 3vw, 25px);
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .control-btn {
            padding: clamp(18px, 4vw, 28px);
            border: none;
            border-radius: 18px;
            font-size: clamp(16px, 3vw, 22px);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            color: white;
            min-height: 60px;
        }

        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .control-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .control-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-team1 { background: var(--team1-color); }
        .btn-team2 { background: var(--team2-color); }
        .btn-undo { background: #ef5350; }
        .btn-change { background: linear-gradient(90deg, #26c6da, #00acc1); }

        /* Team selected state */
        .btn-team1.selected {
            background: #fdd835 !important;
            color: #2c1b4d !important;
            box-shadow: 0 0 0 4px white, 0 8px 25px rgba(253,216,53,0.5) !important;
        }
        .btn-team2.selected {
            background: #fdd835 !important;
            color: #2c1b4d !important;
            box-shadow: 0 0 0 4px white, 0 8px 25px rgba(253,216,53,0.5) !important;
        }

        .bell-btn {
            width: 100%;
            padding: clamp(14px, 3vw, 22px);
            background: linear-gradient(90deg, #B366FF, #FF5599);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: clamp(14px, 2.5vw, 20px);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .bell-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* Animations */
        @keyframes floatUp {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes floatUpMa {
            0%,100% { transform: translateY(0px) scaleX(1); }
            50% { transform: translateY(-8px) scaleX(1.04); }
        }
        @keyframes glow-yellow {
            0%,100% { filter: drop-shadow(0 0 4px rgba(253,216,53,0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(253,216,53,1)) drop-shadow(0 0 36px rgba(253,216,53,0.6)); }
        }
        @keyframes glow-cyan {
            0%,100% { filter: drop-shadow(0 0 4px rgba(38,198,218,0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(38,198,218,1)) drop-shadow(0 0 36px rgba(38,198,218,0.6)); }
        }
        @keyframes glow-red {
            0%,100% { filter: drop-shadow(0 0 4px rgba(239,83,80,0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(239,83,80,1)) drop-shadow(0 0 36px rgba(239,83,80,0.6)); }
        }

        .cell-pop {
            animation: none !important;
        }

        @keyframes bellRing {
            0%, 100% { transform: scale(1) rotate(0); }
            20% { transform: scale(1.1) rotate(15deg); }
            40% { transform: scale(1.1) rotate(-15deg); }
            60% { transform: scale(1.1) rotate(10deg); }
            80% { transform: scale(1.1) rotate(-10deg); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .bell-active {
            animation: bellRing 0.4s ease-in-out;
        }

        /* Buzzer Alert Display - Enhanced CSS Only */
        .buzzer-alert-container {
            display: none;
            width: 100%;
            max-width: 500px;
            border-radius: 25px;
            padding: 20px 30px;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: buzzSlideIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: all 0.1s ease;
            border: 3px solid rgba(255, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
            z-index: 2000;
        }
        
        .buzzer-alert-container.active {
            display: flex !important;
        }
        
        .buzzer-alert-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            animation: rotateGlow 3s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Dynamic colors using team CSS variables */
        .buzzer-alert-container.green {
            background: linear-gradient(135deg, var(--team1-color), #1b5e20) !important;
            box-shadow: 0 0 40px rgba(46, 204, 0, 0.7), inset 0 0 20px rgba(255,255,255,0.3);
        }
        .buzzer-alert-container.orange {
            background: linear-gradient(135deg, var(--team2-color), #e65100) !important;
            box-shadow: 0 0 40px rgba(255, 109, 0, 0.7), inset 0 0 20px rgba(255,255,255,0.3);
        }
        
        .buzzer-alert-container .buzzer-alert-text,
        .buzzer-alert-container .buzzer-alert-player {
            color: white !important;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        @keyframes buzzSlideIn {
            0% { transform: scale(0.95) translateY(-5px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes buzzPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .buzzer-alert {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            flex-wrap: nowrap;
            animation: buzzPulse 0.8s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        .buzzer-alert-icon {
            font-size: 50px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
            animation: bellShake 0.5s ease-in-out infinite;
        }

        @keyframes bellShake {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }

        .buzzer-alert-text {
            color: white;
            font-size: clamp(22px, 5vw, 30px);
            font-weight: 900;
            text-align: center;
            letter-spacing: 1px;
        }

        .buzzer-alert-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .buzzer-alert-team {
            font-size: clamp(14px, 3vw, 18px);
            padding: 4px 15px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .buzzer-alert-player {
            color: white;
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 900;
            margin-top: 2px;
        }

        .reset-buzz-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 12px;
            background: #2c1b4d;
            color: white;
            font-size: clamp(14px, 2.5vw, 18px);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reset-buzz-btn:hover {
            transform: scale(1.05);
            background: #3d2a5f;
        }

        /* Instruction text - Hidden */
        .instruction {
            display: none;
        }

        /* Question Display */
        .question-box {
            background: #2c1b4d;
            border-radius: 20px;
            padding: 15px 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .question-letter {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 900;
            color: #fdd835;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: clamp(16px, 3vw, 22px);
            color: white;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .question-answer {
            font-size: clamp(18px, 3vw, 24px);
            color: #fdd835;
            font-weight: 700;
        }

        .loading-text {
            color: #888;
            font-size: 14px;
        }

        /* Responsive - Mobile Full Screen - No Scroll */
        @media (max-width: 500px), (max-height: 600px) {
            html, body {
                height: 100%;
                min-height: 100vh;
                min-height: 100dvh;
                padding: 4px 3px;
                overflow: hidden;
            }

            body {
                justify-content: flex-start;
                gap: 3px;
            }

            .content {
                gap: 4px;
                width: 100%;
                max-width: 100%;
                height: 100%;
            }

            .logo-stack {
                transform: scale(0.55);
                transform-origin: top center;
            }

            .presenter-label {
                margin-top: 0;
                font-size: 13px;
            }

            .score-section {
                gap: 10px;
                width: 100%;
                justify-content: center;
            }

            .score-box {
                width: 50px;
                height: 50px;
                font-size: 24px;
                border-radius: 10px;
            }

            .team-label {
                font-size: 11px;
            }

            .instruction {
                display: none;
            }

            .question-box {
                padding: 10px 12px;
                border-radius: 12px;
            }

            .question-letter {
                font-size: 24px;
                margin-bottom: 5px;
            }

            .question-text {
                font-size: 14px;
                margin-bottom: 8px;
            }

            .question-answer {
                font-size: 16px;
            }

            .hex-board {
                max-width: 100%;
                flex: 1;
                min-height: 0;
                padding: 8px;
                border-radius: 15px;
            }

            .control-panel {
                max-width: 100%;
                padding: 6px;
                gap: 6px;
                border-radius: 15px;
            }

            /* الأزرار أكبر على الهاتف */
            .control-btn {
                padding: 12px 8px;
                font-size: 14px;
                min-height: 50px;
                border-radius: 10px;
            }

            .bell-btn {
                padding: 12px 8px;
                font-size: 14px;
                border-radius: 10px;
            }
            
            .buzzer-alert-container {
                padding: 12px 15px;
                border-radius: 15px;
            }
            .buzzer-alert-icon { font-size: 35px; }
            .buzzer-alert-text { font-size: 18px; }
            .buzzer-alert-player { font-size: 16px; }
        }
    </style>
</head>
<body>
    <button class="fullscreen-btn" id="fullscreen-btn" title="ملء الشاشة">
        <svg viewBox="0 0 24 24" id="fullscreen-icon">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
    </button>
    <!-- Hex Background -->
    <div class="hex-bg">
        <svg xmlns="http://www.w3.org/2000/svg" id="hex-pattern-svg"></svg>
    </div>

    <!-- Content -->
    <div class="content">
        <!-- Logo -->
        <div class="logo-stack">
            <span class="logo-word logo-huroof">حروف</span>
            <span class="logo-word logo-ma">مع</span>
            <span class="logo-word logo-marah" id="logoName">مراح</span>
        </div>

        <!-- Score Section -->
        <div class="score-section">
            <div class="score-card">
                <div class="team-label green" id="team1Label">الفريق الأول</div>
                <div class="score-box green-score" id="score1">0</div>
            </div>
            <div class="score-card">
                <div class="team-label orange" id="team2Label">الفريق الثاني</div>
                <div class="score-box orange-score" id="score2">0</div>
            </div>
        </div>

        <!-- Question Display -->
        <div class="question-box" id="questionBox">
            <div class="loading-text">جاري تحميل الأسئلة...</div>
        </div>

        <!-- Hex Board -->
        <div class="hex-board">
            <svg viewBox="0 0 400 400" id="board"></svg>
        </div>

        <!-- Buzzer Alert - Shows only when someone buzzes -->
        <div class="buzzer-alert-container" id="buzzerAlert">
            <div class="buzzer-alert">
                <div class="buzzer-alert-icon">🔔</div>
                <div class="buzzer-alert-info">
                    <div class="buzzer-alert-text">ضغط الجرس!</div>
                    <div class="buzzer-alert-team" id="buzzerAlertTeam"></div>
                    <div class="buzzer-alert-player" id="buzzerAlertPlayer"></div>
                </div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="control-grid">
                <button class="control-btn btn-team1" id="btnTeam1" onclick="selectTeam('green')" disabled>
                    <span id="btnTeam1Text">الفريق الأول</span>
                </button>
                <button class="control-btn btn-team2" id="btnTeam2" onclick="selectTeam('orange')" disabled>
                    <span id="btnTeam2Text">الفريق الثاني</span>
                </button>
                <button class="control-btn btn-undo" id="btnUndo" onclick="undoSelection()" disabled>
                    إلغاء التحديد
                </button>
                <button class="control-btn btn-change" id="btnChangeQuestion" onclick="changeQuestion()" disabled>
                    تغيير السؤال
                </button>
            </div>

            <button class="bell-btn" onclick="resetBuzzFromPresenter()">
                إعادة تعيين الجرس
            </button>
        </div>
    </div>

    };
    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);

    /* ===== HEX PATTERN ===== */
    function drawHexPattern(svgEl) {
        const R = 50, w = Math.sqrt(3)*R, h = 2*R;
        const cols = Math.ceil(window.innerWidth/w)+2;
        const rows = Math.ceil(window.innerHeight/(h*0.75))+2;
        let d = '';
        for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
            const cx = c*w+(r%2===1?w/2:0), cy = r*h*0.75;
            let pts='';
            for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);pts+=(i===0?'M':'L')+(cx+R*Math.cos(a)).toFixed(1)+','+(cy+R*Math.sin(a)).toFixed(1);}
            d+=pts+'Z ';
        }
        const path=document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d',d); path.setAttribute('fill','none');
        path.setAttribute('stroke','white'); path.setAttribute('stroke-width','2');
        svgEl.appendChild(path);
    }
    drawHexPattern(document.getElementById('hex-pattern-svg'));

    /* ===== SESSION MANAGEMENT ===== */
    const urlParams = new URLSearchParams(window.location.search);
    let sessionId = urlParams.get('session') || 'default';

    /* ===== FIREBASE REFS ===== */
    const settingsRef         = () => ref(db, 'sessions/' + sessionId + '/settings');
    const lettersRef          = () => ref(db, 'sessions/' + sessionId + '/letters');
    const gameStateRef        = () => ref(db, 'sessions/' + sessionId + '/gameState');
    const buzzRef             = () => ref(db, 'sessions/' + sessionId + '/buzz');
    const buzzLockRef         = () => ref(db, 'sessions/' + sessionId + '/buzzLock');
    const buzzResetRef        = () => ref(db, 'sessions/' + sessionId + '/buzzReset');

    /* ===== STATE ===== */
    let letters = [];
    let currentQuestion = null;
    let lastSelectedTeam = null;
    let currentBuzz = null;

    /* ===== UI UPDATES ===== */
    function updateAllLogos() {
        onValue(settingsRef(), (snap) => {
            const data = snap.val();
            if(data) {
                if(data.logoName) document.getElementById('logoName').textContent = data.logoName;
                if(data.team1Name) {
                    document.getElementById('team1Label').textContent = data.team1Name;
                    document.getElementById('btnTeam1Text').textContent = data.team1Name;
                }
                if(data.team2Name) {
                    document.getElementById('team2Label').textContent = data.team2Name;
                    document.getElementById('btnTeam2Text').textContent = data.team2Name;
                }
            }
        });
    }

    async function fetchQuestions() {
        const snap = await get(ref(db, 'questions'));
        const questions = snap.val() || [];
        
        onValue(gameStateRef(), (snap) => {
            const state = snap.val();
            if(state && state.currentLetter) {
                const q = questions.find(x => x.letter === state.currentLetter);
                if(q) {
                    currentQuestion = q;
                    renderQuestion(q);
                }
            } else {
                document.getElementById('questionBox').innerHTML = '<div class="loading-text">اختر حرفاً للبدء</div>';
            }
        });
    }

    function renderQuestion(q) {
        const box = document.getElementById('questionBox');
        box.innerHTML = `
            <div class="question-letter">حرف (${q.letter})</div>
            <div class="question-text">${q.question}</div>
            <div class="question-answer">الإجابة: ${q.answer}</div>
        `;
    }

    function buildBoard() {
        const board = document.getElementById('board');
        const R = 32, w = Math.sqrt(3)*R, h = 2*R;
        const rows = [4, 5, 4, 5, 4];
        let idx = 0;
        const alphabet = "أبتثجحخدذرزسشصضطظعغفقكلمنهوي".split("");

        onValue(lettersRef(), (snap) => {
            const data = snap.val() || {};
            board.innerHTML = '';
            idx = 0;
            rows.forEach((count, r) => {
                for(let c=0; c<count; c++) {
                    const cx = 200 + (c - (count-1)/2) * w;
                    const cy = 200 + (r - 2) * h * 0.75;
                    const letter = alphabet[idx] || '';
                    const status = data[letter] || 'none';
                    drawHex(board, cx, cy, letter, status);
                    idx++;
                }
            });
        });
    }

    function drawHex(svg, cx, cy, letter, status) {
        const R = 32;
        let pts = '';
        for(let i=0; i<6; i++) {
            const a = Math.PI/180 * (60*i - 30);
            pts += (i===0?'M':'L') + (cx + R*Math.cos(a)) + ',' + (cy + R*Math.sin(a));
        }
        const g = document.createElementNS('http://www.w3.org/2000/svg','g');
        g.setAttribute('class', 'hexagon ' + status + '-fill');
        g.onclick = () => setLetterActive(letter);

        const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
        poly.setAttribute('points', pts + ' Z');
        poly.setAttribute('class', 'hex-poly');

        const text = document.createElementNS('http://www.w3.org/2000/svg','text');
        text.setAttribute('x', cx); text.setAttribute('y', cy);
        text.setAttribute('class', 'hex-text');
        text.textContent = letter;

        g.appendChild(poly); g.appendChild(text);
        svg.appendChild(g);
    }

    function setLetterActive(letter) {
        set(gameStateRef(), { currentLetter: letter });
        set(lettersRef(), { [letter]: 'pending' });
        document.getElementById('btnTeam1').disabled = false;
        document.getElementById('btnTeam2').disabled = false;
        document.getElementById('btnUndo').disabled = false;
        document.getElementById('btnChangeQuestion').disabled = false;
        lastSelectedTeam = null;
        document.getElementById('btnTeam1').classList.remove('selected');
        document.getElementById('btnTeam2').classList.remove('selected');
    }

    function selectTeam(team) {
        onValue(gameStateRef(), (snap) => {
            const state = snap.val();
            if(state && state.currentLetter) {
                set(lettersRef(), { [state.currentLetter]: team });
                lastSelectedTeam = team;
                document.getElementById('btnTeam1').classList.toggle('selected', team==='green');
                document.getElementById('btnTeam2').classList.toggle('selected', team==='orange');
                updateScore();
            }
        }, { onlyOnce: true });
    }

    function undoSelection() {
        onValue(gameStateRef(), (snap) => {
            const state = snap.val();
            if(state && state.currentLetter) {
                set(lettersRef(), { [state.currentLetter]: 'none' });
                set(gameStateRef(), { currentLetter: null });
                document.getElementById('btnTeam1').disabled = true;
                document.getElementById('btnTeam2').disabled = true;
                document.getElementById('btnUndo').disabled = true;
                document.getElementById('btnChangeQuestion').disabled = true;
                document.getElementById('btnTeam1').classList.remove('selected');
                document.getElementById('btnTeam2').classList.remove('selected');
                updateScore();
            }
        }, { onlyOnce: true });
    }

    function changeQuestion() {
        onValue(gameStateRef(), (snap) => {
            const state = snap.val();
            if(state && state.currentLetter) {
                set(lettersRef(), { [state.currentLetter]: 'none' });
                set(gameStateRef(), { currentLetter: null });
                document.getElementById('btnTeam1').disabled = true;
                document.getElementById('btnTeam2').disabled = true;
                document.getElementById('btnUndo').disabled = true;
                document.getElementById('btnChangeQuestion').disabled = true;
            }
        }, { onlyOnce: true });
    }

    function updateScore() {
        get(lettersRef()).then(snap => {
            const data = snap.val() || {};
            let s1=0, s2=0;
            Object.values(data).forEach(v => {
                if(v==='green') s1++;
                if(v==='orange') s2++;
            });
            document.getElementById('score1').textContent = s1;
            document.getElementById('score2').textContent = s2;
        });
    }

    function playBell() {
        const btn = document.querySelector('.bell-btn');
        btn.classList.add('bell-active');
        setTimeout(() => btn.classList.remove('bell-active'), 400);
    }

    /* ===== BUZZER LISTENER - ORIGINAL LOGIC RESTORED 100% ===== */
    onValue(buzzLockRef(), (snap) => {
        const lock = snap.val();
        if (lock && lock.active) {
            currentBuzz = { name:lock.playerName, teamName:lock.teamName, team:lock.team, timestamp:lock.timestamp, active:true };
            showBuzzerAlert(currentBuzz);
        }
    });

    function showBuzzerAlert(buzz) {
        const container = document.getElementById('buzzerAlert');
        const teamEl = document.getElementById('buzzerAlertTeam');
        const playerEl = document.getElementById('buzzerAlertPlayer');
        
        container.classList.remove('green','orange');
        teamEl.textContent = buzz.teamName;
        teamEl.className = 'buzzer-alert-team ' + (buzz.team || '');
        playerEl.textContent = buzz.name;
        
        const containerTeam = lastSelectedTeam || buzz.team;
        if (containerTeam) container.classList.add(containerTeam);
        
        container.style.display = 'flex';
        void container.offsetWidth; 
        container.classList.add('active');
        
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type='sine'; osc.frequency.setValueAtTime(880,ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440,ctx.currentTime+0.5);
            gain.gain.setValueAtTime(0.8,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.0);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime+1.0);
        } catch(e) {}
    }

    function resetBuzzFromPresenter() {
        const container = document.getElementById('buzzerAlert');
        container.classList.remove('active');
        setTimeout(() => { container.style.display = 'none'; }, 200);
        
        currentBuzz = null;
        remove(buzzRef());
        remove(buzzLockRef());
        set(buzzResetRef(), { reset:true, timestamp:Date.now() });
        setTimeout(() => remove(buzzResetRef()), 2000);
    }

    /* ===== INIT ===== */
    updateAllLogos();
    fetchQuestions();
    buildBoard();

    /* ===== EXPOSE FUNCTIONS TO GLOBAL SCOPE (for onclick attributes) ===== */
    window.selectTeam       = selectTeam;
    window.undoSelection    = undoSelection;
    window.changeQuestion   = changeQuestion;
    window.playBell         = playBell;
    window.resetBuzzFromPresenter = resetBuzzFromPresenter;

    // Fullscreen Logic
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const fullscreenIcon = document.getElementById('fullscreen-icon');

    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable full-screen mode: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    });

    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            fullscreenIcon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
        } else {
            fullscreenIcon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
        }
    });

    </script>
</body>
</html>

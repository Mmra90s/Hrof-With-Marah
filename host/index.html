<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المقدم - حروف مع مراح</title>
    <style>
        @font-face {
            font-family: 'AA-GALAXY';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXY.otf');
        }
        @font-face {
            font-family: 'AA-GALAXY-BOLD';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXYBold.otf');
        }
        * {
            font-family: 'AA-GALAXY-BOLD', 'AA-GALAXY', sans-serif !important;
            box-sizing: border-box; margin: 0; padding: 0;
        }

        html, body {
            overflow: auto;
            height: auto;
        }

        body {
            background: #6a3093;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            gap: 15px;
            position: relative;
        }

        /* Hex Background */
        .hex-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #6a3093;
            overflow: hidden;
            z-index: 0;
        }
        .hex-bg svg {
            width: 100%;
            height: 100%;
            opacity: 0.18;
        }

        /* Content Container */
        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
            padding-bottom: 15px;
        }

        /* Logo Stack */
        .logo-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
            pointer-events: none;
        }
        .logo-word {
            font-weight: 900;
            text-align: center;
            display: inline-block;
        }

        .logo-huroof {
            color: #fdd835;
            font-size: clamp(40px, 7vw, 70px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 6px 6px 0 #2c1b4d,
                7px 7px 0 #2c1b4d, 8px 8px 0 #2c1b4d, 10px 10px 15px rgba(0,0,0,0.6);
            animation: floatUp 4s ease-in-out infinite, glow-yellow 4s ease-in-out infinite;
        }
        .logo-ma {
            color: #26c6da;
            font-size: clamp(30px, 5vw, 55px);
            letter-spacing: clamp(8px, 1.5vw, 15px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 7px 7px 15px rgba(0,0,0,0.6);
            animation: floatUpMa 4s ease-in-out 0.5s infinite, glow-cyan 4s ease-in-out 0.5s infinite;
        }
        .logo-marah {
            color: #ef5350;
            font-size: clamp(40px, 7vw, 70px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 6px 6px 0 #2c1b4d,
                7px 7px 0 #2c1b4d, 8px 8px 0 #2c1b4d, 10px 10px 15px rgba(0,0,0,0.6);
            animation: floatUp 4s ease-in-out 1s infinite, glow-red 4s ease-in-out 1s infinite;
        }

        .presenter-label {
            color: white;
            font-size: clamp(18px, 3vw, 28px);
            font-weight: 900;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            margin-top: 5px;
        }

        /* Score Section */
        .score-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(20px, 5vw, 50px);
            width: 100%;
        }

        .score-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .team-label {
            font-size: clamp(14px, 2.5vw, 22px);
            font-weight: 900;
            text-align: center;
            max-width: clamp(80px, 12vw, 130px);
            word-break: break-word;
        }

        .team-label.green { color: #2ecc00; }
        .team-label.orange { color: #ff6d00; }

        .score-box {
            width: clamp(55px, 10vw, 90px);
            height: clamp(55px, 10vw, 90px);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 900;
            color: white;
            border-radius: clamp(12px, 2vw, 20px);
        }

        .green-score {
            background: #2ecc00;
            box-shadow: 0 4px 15px rgba(46, 204, 0, 0.4);
        }
        .orange-score {
            background: #ff6d00;
            box-shadow: 0 4px 15px rgba(255, 109, 0, 0.4);
        }

        /* Hex Board */
        .hex-board {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: conic-gradient(from 45deg, #2ecc00 90deg, #ff6d00 90deg 180deg, #2ecc00 180deg 270deg, #ff6d00 270deg);
            border-radius: 20px;
            padding: 20px;
            overflow: visible;
        }

        .hex-board svg {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: visible;
        }

        .hexagon {
            cursor: pointer;
        }
        .hex-poly {
            stroke: #6a3093;
            stroke-width: 6;
            stroke-linejoin: round;
            fill: white;
            transition: fill 0.3s;
        }
        .hex-text {
            font-size: clamp(24px, 4vw, 38px);
            font-weight: 900;
            fill: #6a3093;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: central;
        }

        /* Pending state - yellow glow */
        .pending-fill .hex-poly {
            fill: #fdd835 !important;
        }
        .pending-fill .hex-text {
            fill: #2c1b4d !important;
        }

        /* Team fills */
        .green-fill .hex-poly { fill: #2ecc00 !important; }
        .orange-fill .hex-poly { fill: #ff6d00 !important; }
        .green-fill .hex-text,
        .orange-fill .hex-text { fill: white !important; }

        /* Control Panel */
        .control-panel {
            background: #2c1b4d;
            border-radius: 20px;
            padding: clamp(15px, 3vw, 25px);
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .control-btn {
            padding: clamp(18px, 4vw, 28px);
            border: none;
            border-radius: 18px;
            font-size: clamp(16px, 3vw, 22px);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            color: white;
            min-height: 60px;
        }

        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .control-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .control-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-team1 { background: #2ecc00; }
        .btn-team2 { background: #ff6d00; }
        .btn-undo { background: #ef5350; }
        .btn-change { background: linear-gradient(90deg, #26c6da, #00acc1); }

        /* Team selected state */
        .btn-team1.selected {
            background: #fdd835 !important;
            color: #2c1b4d !important;
            box-shadow: 0 0 0 4px white, 0 8px 25px rgba(253,216,53,0.5) !important;
        }
        .btn-team2.selected {
            background: #fdd835 !important;
            color: #2c1b4d !important;
            box-shadow: 0 0 0 4px white, 0 8px 25px rgba(253,216,53,0.5) !important;
        }

        .bell-btn {
            width: 100%;
            padding: clamp(14px, 3vw, 22px);
            background: linear-gradient(90deg, #B366FF, #FF5599);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: clamp(14px, 2.5vw, 20px);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .bell-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* Animations */
        @keyframes floatUp {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes floatUpMa {
            0%,100% { transform: translateY(0px) scaleX(1); }
            50% { transform: translateY(-8px) scaleX(1.04); }
        }
        @keyframes glow-yellow {
            0%,100% { filter: drop-shadow(0 0 4px rgba(253,216,53,0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(253,216,53,1)) drop-shadow(0 0 36px rgba(253,216,53,0.6)); }
        }
        @keyframes glow-cyan {
            0%,100% { filter: drop-shadow(0 0 4px rgba(38,198,218,0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(38,198,218,1)) drop-shadow(0 0 36px rgba(38,198,218,0.6)); }
        }
        @keyframes glow-red {
            0%,100% { filter: drop-shadow(0 0 4px rgba(239,83,80,0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(239,83,80,1)) drop-shadow(0 0 36px rgba(239,83,80,0.6)); }
        }

        /* Question Area */
        .question-area {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: clamp(15px, 3vw, 25px);
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            min-height: 180px;
            position: relative;
        }

        .instruction {
            color: #6a3093;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
        }

        .question-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }

        .question-letter {
            font-size: 32px;
            font-weight: 900;
            color: #6a3093;
            background: #fdd835;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: clamp(18px, 3.5vw, 24px);
            font-weight: 700;
            color: #2c1b4d;
            line-height: 1.4;
        }

        .question-answer {
            font-size: clamp(16px, 3vw, 20px);
            font-weight: 900;
            color: #2ecc00;
            margin-top: 5px;
            padding: 10px;
            background: #f1f8e9;
            border-radius: 10px;
            display: none;
        }
        .question-answer.visible { display: block; }

        /* Buzzer Alert */
        .buzzer-alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            width: 90%;
            max-width: 400px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 4px solid #fdd835;
        }
        .buzzer-alert.active {
            transform: translateX(-50%) translateY(0);
        }

        .buzzer-alert-title {
            font-size: 20px;
            font-weight: 900;
            color: #6a3093;
        }
        .buzzer-alert-team {
            font-size: 28px;
            font-weight: 900;
            padding: 5px 20px;
            border-radius: 10px;
            color: white;
        }
        .buzzer-alert-team.green { background: #2ecc00; }
        .buzzer-alert-team.orange { background: #ff6d00; }

        .buzzer-alert-player {
            font-size: 24px;
            font-weight: 700;
            color: #2c1b4d;
        }

        .bell-active {
            animation: bellShake 0.4s ease-in-out;
        }
        @keyframes bellShake {
            0%, 100% { transform: rotate(0); }
            20% { transform: rotate(15deg); }
            40% { transform: rotate(-15deg); }
            60% { transform: rotate(10deg); }
            80% { transform: rotate(-10deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="hex-bg">
        <svg id="hex-bg-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice"></svg>
    </div>

    <div class="buzzer-alert" id="buzzerAlert">
        <div class="buzzer-alert-title">🔔 جرس اللاعب!</div>
        <div id="buzzerAlertTeam" class="buzzer-alert-team">الفريق</div>
        <div id="buzzerAlertPlayer" class="buzzer-alert-player">اسم اللاعب</div>
    </div>

    <div class="content">
        <div class="logo-stack">
            <div class="logo-word logo-huroof">حروف</div>
            <div class="logo-word logo-ma">مع</div>
            <div class="logo-word logo-marah" id="logoName">مراح</div>
            <div class="presenter-label">شاشة المقدم</div>
        </div>

        <div class="score-section">
            <div class="score-card">
                <div class="team-label green" id="team1Label">الفريق الأول</div>
                <div class="score-box green-score" id="score1">0</div>
            </div>
            <div class="score-card">
                <div class="team-label orange" id="team2Label">الفريق الثاني</div>
                <div class="score-box orange-score" id="score2">0</div>
            </div>
        </div>

        <div class="hex-board">
            <svg id="board" viewBox="0 0 400 400"></svg>
        </div>

        <div class="question-area">
            <div class="instruction" id="instruction">اختر حرفاً من اللوحة</div>
            <div class="question-box" id="questionBox">
                <div class="question-text">بانتظار اختيار حرف...</div>
            </div>
        </div>

        <div class="control-panel">
            <div class="control-grid">
                <button class="control-btn btn-team1" id="btnTeam1" onclick="selectTeam('green')" disabled>
                    <span id="btnTeam1Text">الفريق الأول</span>
                </button>
                <button class="control-btn btn-team2" id="btnTeam2" onclick="selectTeam('orange')" disabled>
                    <span id="btnTeam2Text">الفريق الثاني</span>
                </button>
                <button class="control-btn btn-undo" id="btnUndo" onclick="undoSelection()" disabled>تراجع</button>
                <button class="control-btn btn-change" id="btnChangeQuestion" onclick="changeQuestion()" disabled>تغيير السؤال</button>
            </div>
            <button class="bell-btn" id="bellBtn" onclick="playBellManually()">
                <span>🔔 رنة الجرس</span>
            </button>
        </div>
    </div>

    <script>
        /* ===== SESSION MANAGEMENT ===== */
        const urlParams = new URLSearchParams(window.location.search);
        let sessionId = urlParams.get('session');
        if (!sessionId) {
            sessionId = 'default'; // Fallback
        }

        /* ===== DATA ===== */
        let questionsData = {};
        let letters = [];
        let cells = [];
        let selectedCell = null;
        let currentQuestionLetter = null;
        let greenScore = 0;
        let orangeScore = 0;
        let settings = { name: 'مراح', team1: 'الفريق الأول', team2: 'الفريق الثاني', rounds: 2 };
        let usedQuestions = {};

        /* ===== BACKGROUND ===== */
        function drawHexPattern(svgEl) {
            const R = 50, w = Math.sqrt(3)*R, h = 2*R;
            const cols = 15, rows = 15;
            let d = '';
            for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
                const cx = c*w+(r%2===1?w/2:0), cy = r*h*0.75;
                let pts='';
                for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);pts+=(i===0?'M':'L')+(cx+R*Math.cos(a)).toFixed(1)+','+(cy+R*Math.sin(a)).toFixed(1);}
                d+=pts+'Z ';
            }
            const path=document.createElementNS('http://www.w3.org/2000/svg','path');
            path.setAttribute('d',d); path.setAttribute('fill','none');
            path.setAttribute('stroke','white'); path.setAttribute('stroke-width','2');
            svgEl.appendChild(path);
        }
        drawHexPattern(document.getElementById('hex-bg-svg'));

        /* ===== CORE FUNCTIONS ===== */
        async function fetchQuestions() {
            try {
                // In a real app, this would be a JSON file. For now, we'll use a placeholder.
                // We'll simulate fetching by creating a basic set.
                const lettersArr = ["أ","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن"];
                lettersArr.forEach(l => {
                    questionsData[l] = [
                        { question: `سؤال يبدأ بحرف (${l})... ما هو؟`, answer: `إجابة حرف (${l})` },
                        { question: `سؤال آخر بحرف (${l})... ما هو؟`, answer: `إجابة ثانية لـ (${l})` }
                    ];
                    usedQuestions[l] = [];
                });
            } catch (e) { console.error("Error fetching questions", e); }
        }

        function updateAllLogos() {
            document.getElementById('logoName').textContent = settings.name;
            document.getElementById('team1Label').textContent = settings.team1;
            document.getElementById('team2Label').textContent = settings.team2;
            document.getElementById('btnTeam1Text').textContent = settings.team1;
            document.getElementById('btnTeam2Text').textContent = settings.team2;
        }

        function updateInstruction() {
            const inst = document.getElementById('instruction');
            if (!selectedCell) {
                inst.textContent = 'اختر حرفاً من اللوحة';
            } else {
                inst.textContent = 'اختر الفريق للإجابة';
            }
        }

        function setTeamButtonsEnabled(enabled) {
            document.getElementById('btnTeam1').disabled = !enabled;
            document.getElementById('btnTeam2').disabled = !enabled;
        }

        function buildBoard() {
            const svg = document.getElementById('board');
            svg.innerHTML = '';
            cells = [];

            const sharedLetters = localStorage.getItem('huroofLetters_' + sessionId);
            if (sharedLetters) {
                try { letters = JSON.parse(sharedLetters); } 
                catch(e) { letters = generateRandomLetters(); }
            } else {
                letters = generateRandomLetters();
            }

            const R = 38, w = Math.sqrt(3) * R, h = 2 * R;
            const startX = 200 - 2 * w - 10, startY = 200 - 2 * h * 0.75 + 5;

            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const x = startX + col * w + (row % 2 === 1 ? w / 2 : 0);
                    const y = startY + row * h * 0.75;
                    createHexagon(svg, x, y, letters[row * 5 + col], row * 5 + col);
                }
            }
        }

        function generateRandomLetters() {
            return ["أ","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن"].sort(() => Math.random() - 0.5);
        }

        function createHexagon(svg, x, y, letter, id) {
            const R = 38;
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("class", "hexagon");
            g.setAttribute("transform", `translate(${x}, ${y})`);
            
            const pts = [];
            for (let i = 0; i < 6; i++) {
                const a = (Math.PI / 180) * (60 * i - 30);
                pts.push(`${(R * Math.cos(a)).toFixed(1)},${(R * Math.sin(a)).toFixed(1)}`);
            }

            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute("points", pts.join(" "));
            poly.setAttribute("class", "hex-poly");

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("class", "hex-text");
            text.setAttribute("dy", "4");
            text.textContent = letter;

            g.appendChild(poly);
            g.appendChild(text);

            const cell = { el: g, owner: null, isPending: false, text: text, id: id };
            cells.push(cell);
            g.onclick = () => selectCell(cell);
            svg.appendChild(g);
        }

        function selectCell(cell) {
            if (cell.owner) return;
            if (selectedCell && selectedCell !== cell) {
                selectedCell.isPending = false;
                selectedCell.el.classList.remove('pending-fill');
                broadcastAction({ type: 'cell_unselected', cellId: selectedCell.id });
            }

            selectedCell = cell;
            cell.isPending = true;
            cell.el.classList.add('pending-fill');
            
            const letter = cell.text.textContent;
            displayQuestion(letter);
            setTeamButtonsEnabled(true);
            document.getElementById('btnUndo').disabled = false;
            broadcastAction({ type: 'cell_selected', cellId: cell.id });
            updateInstruction();
        }

        function displayQuestion(letter) {
            currentQuestionLetter = letter;
            const questions = questionsData[letter] || [{question: "لا يوجد سؤال", answer: "لا يوجد"}];
            const q = questions[0]; // Simple for now
            document.getElementById('questionBox').innerHTML = `
                <div class="question-letter">${letter}</div>
                <div class="question-text">${q.question}</div>
                <div class="question-answer" id="currentAnswer">الإجابة: ${q.answer}</div>
            `;
            document.getElementById('btnChangeQuestion').disabled = false;
        }

        function selectTeam(team) {
            if (!selectedCell) return;
            const cellId = selectedCell.id;
            selectedCell.owner = team;
            selectedCell.isPending = false;
            selectedCell.el.classList.remove('pending-fill');
            selectedCell.el.classList.add(team + '-fill');
            selectedCell.text.style.display = 'none';

            setTeamButtonsEnabled(false);
            document.getElementById('btnUndo').disabled = true;
            document.getElementById('btnChangeQuestion').disabled = true;
            
            broadcastAction({ type: 'team_selected', cellId: cellId, team: team });
            selectedCell = null;
            updateInstruction();
            resetBuzzFromPresenter();
        }

        function undoSelection() {
            if (!selectedCell) return;
            selectedCell.isPending = false;
            selectedCell.el.classList.remove('pending-fill');
            broadcastAction({ type: 'cell_unselected', cellId: selectedCell.id });
            selectedCell = null;
            setTeamButtonsEnabled(false);
            document.getElementById('btnUndo').disabled = true;
            document.getElementById('questionBox').innerHTML = `<div class="question-text">بانتظار اختيار حرف...</div>`;
            updateInstruction();
        }

        function changeQuestion() {
            if (!currentQuestionLetter) return;
            displayQuestion(currentQuestionLetter); // Simple toggle for now
        }

        /* ===== SYNC SYSTEM ===== */
        function broadcastAction(action) {
            const key = 'huroofPresenterActions_' + sessionId;
            localStorage.setItem(key, JSON.stringify(action));
            window.dispatchEvent(new StorageEvent('storage', { key: key, newValue: JSON.stringify(action) }));
        }

        function applyGameState(state) {
            if (state.settings) { settings = state.settings; updateAllLogos(); }
            if (state.greenScore !== undefined) { greenScore = state.greenScore; document.getElementById('score1').textContent = greenScore; }
            if (state.orangeScore !== undefined) { orangeScore = state.orangeScore; document.getElementById('score2').textContent = orangeScore; }
            if (state.cells) {
                state.cells.forEach(cData => {
                    const cell = cells[cData.id];
                    if (cell) {
                        cell.owner = cData.owner;
                        cell.isPending = cData.isPending;
                        cell.el.classList.remove('green-fill', 'orange-fill', 'pending-fill');
                        if (cell.owner) {
                            cell.el.classList.add(cell.owner + '-fill');
                            cell.text.style.display = 'none';
                        } else if (cell.isPending) {
                            cell.el.classList.add('pending-fill');
                            cell.text.style.display = 'block';
                        } else {
                            cell.text.style.display = 'block';
                        }
                    }
                });
            }
        }

        window.addEventListener('storage', function(e) {
            if (e.key === 'huroofGameState_' + sessionId && e.newValue) {
                applyGameState(JSON.parse(e.newValue));
            }
            if (e.key === 'huroofSettings_' + sessionId && e.newValue) {
                settings = JSON.parse(e.newValue);
                updateAllLogos();
            }
            if (e.key === 'huroofLetters_' + sessionId && e.newValue) {
                letters = JSON.parse(e.newValue);
                buildBoard();
            }
            if (e.key === 'playerBuzz_' + sessionId && e.newValue) {
                const buzz = JSON.parse(e.newValue);
                if (buzz.active) showBuzzerAlert(buzz);
            }
            if (e.key === 'buzzerLocked_' + sessionId && e.newValue) {
                const lock = JSON.parse(e.newValue);
                if (lock.locked) showBuzzerAlert({ name: lock.playerName, teamName: lock.teamName, team: lock.team, active: true });
            }
        });

        // Polling Fallback
        setInterval(() => {
            const stateStr = localStorage.getItem('huroofGameState_' + sessionId);
            if (stateStr) {
                const state = JSON.parse(stateStr);
                if (!window.lastStateTime || state.timestamp > window.lastStateTime) {
                    window.lastStateTime = state.timestamp;
                    applyGameState(state);
                }
            }
        }, 500);

        /* ===== BUZZER ===== */
        let currentBuzz = null;
        function showBuzzerAlert(buzz) {
            const alert = document.getElementById('buzzerAlert');
            document.getElementById('buzzerAlertTeam').textContent = buzz.teamName;
            document.getElementById('buzzerAlertTeam').className = 'buzzer-alert-team ' + (buzz.team || 'green');
            document.getElementById('buzzerAlertPlayer').textContent = buzz.name;
            alert.classList.add('active');
            playBell();
        }

        function resetBuzzFromPresenter() {
            document.getElementById('buzzerAlert').classList.remove('active');
            localStorage.removeItem('playerBuzz_' + sessionId);
            localStorage.removeItem('buzzerLocked_' + sessionId);
            const resetKey = 'resetBuzz_' + sessionId;
            localStorage.setItem(resetKey, JSON.stringify({ reset: true, timestamp: Date.now() }));
            window.dispatchEvent(new StorageEvent('storage', { key: resetKey, newValue: localStorage.getItem(resetKey) }));
            localStorage.removeItem(resetKey);
        }

        function playBell() {
            const btn = document.getElementById('bellBtn');
            btn.classList.add('bell-active');
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start(); osc.stop(ctx.currentTime + 0.5);
            } catch(e){}
            setTimeout(() => btn.classList.remove('bell-active'), 500);
        }

        function playBellManually() {
            playBell();
            // Optional: broadcast bell to other screens
        }

        /* ===== INIT ===== */
        fetchQuestions().then(() => {
            const storedSettings = localStorage.getItem('huroofSettings_' + sessionId);
            if (storedSettings) settings = JSON.parse(storedSettings);
            updateAllLogos();
            buildBoard();
            updateInstruction();
        });
    </script>
</body>
</html>

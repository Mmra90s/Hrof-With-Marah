<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المقدم - حروف مع مراح</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @font-face {
            font-family: 'AA-GALAXY';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXY.otf');
        }
        @font-face {
            font-family: 'AA-GALAXY-BOLD';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXYBold.otf');
        }
        * {
            font-family: 'AA-GALAXY-BOLD', 'AA-GALAXY', sans-serif !important;
            box-sizing: border-box; margin: 0; padding: 0;
        }

        html, body {
            overflow: auto;
            height: auto;
        }

        body {
            background: #6a3093;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            gap: 15px;
            position: relative;
        }

        /* Hex Background */
        .hex-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #6a3093;
            overflow: hidden;
            z-index: 0;
        }
        .hex-bg svg {
            width: 100%;
            height: 100%;
            opacity: 0.18;
        }

        /* Content Container */
        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
            padding-bottom: 15px;
        }

        /* Logo Stack */
        .logo-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
            pointer-events: none;
        }
        .logo-word {
            font-weight: 900;
            text-align: center;
            display: inline-block;
        }

        .logo-huroof {
            color: #fdd835;
            font-size: clamp(40px, 7vw, 70px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 6px 6px 0 #2c1b4d,
                7px 7px 0 #2c1b4d, 8px 8px 0 #2c1b4d, 10px 10px 15px rgba(0,0,0,0.6);
            animation: floatUp 4s ease-in-out infinite, glow-yellow 4s ease-in-out infinite;
        }
        .logo-ma {
            color: #26c6da;
            font-size: clamp(30px, 5vw, 55px);
            letter-spacing: clamp(8px, 1.5vw, 15px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 7px 7px 15px rgba(0,0,0,0.6);
            animation: floatUpMa 4s ease-in-out 0.5s infinite, glow-cyan 4s ease-in-out 0.5s infinite;
        }
        .logo-marah {
            color: #ef5350;
            font-size: clamp(40px, 7vw, 70px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 6px 6px 0 #2c1b4d,
                7px 7px 0 #2c1b4d, 8px 8px 0 #2c1b4d, 10px 10px 15px rgba(0,0,0,0.6);
            animation: floatUp 4s ease-in-out 1s infinite, glow-red 4s ease-in-out 1s infinite;
        }

        .presenter-label {
            color: white;
            font-size: clamp(18px, 3vw, 28px);
            font-weight: 900;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            margin-top: 5px;
        }

        /* Score Section */
        .score-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(20px, 5vw, 50px);
            width: 100%;
        }

        .score-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .team-label {
            font-size: clamp(14px, 2.5vw, 22px);
            font-weight: 900;
            text-align: center;
            max-width: clamp(80px, 12vw, 130px);
            word-break: break-word;
        }

        .team-label.green { color: #2ecc00; }
        .team-label.orange { color: #ff6d00; }

        .score-box {
            width: clamp(55px, 10vw, 90px);
            height: clamp(55px, 10vw, 90px);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 900;
            color: white;
            border-radius: clamp(12px, 2vw, 20px);
        }

        .green-score {
            background: #2ecc00;
            box-shadow: 0 4px 15px rgba(46, 204, 0, 0.4);
        }
        .orange-score {
            background: #ff6d00;
            box-shadow: 0 4px 15px rgba(255, 109, 0, 0.4);
        }

        /* Hex Board */
        .hex-board {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: conic-gradient(from 45deg, #2ecc00 90deg, #ff6d00 90deg 180deg, #2ecc00 180deg 270deg, #ff6d00 270deg);
            border-radius: 20px;
            padding: 20px;
            overflow: visible;
        }

        .hex-board svg {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: visible;
        }

        .hexagon {
            cursor: pointer;
        }
        .hex-poly {
            stroke: #6a3093;
            stroke-width: 6;
            stroke-linejoin: round;
            fill: white;
            transition: fill 0.3s;
        }
        .hex-text {
            font-size: clamp(24px, 4vw, 38px);
            font-weight: 900;
            fill: #6a3093;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: central;
        }

        /* Pending state - yellow glow */
        .pending-fill .hex-poly {
            fill: #fdd835 !important;
        }
        .pending-fill .hex-text {
            fill: #2c1b4d !important;
        }

        /* Team fills */
        .green-fill .hex-poly { fill: #2ecc00 !important; }
        .orange-fill .hex-poly { fill: #ff6d00 !important; }
        .green-fill .hex-text,
        .orange-fill .hex-text { fill: white !important; }

        /* Control Panel */
        .control-panel {
            background: #2c1b4d;
            border-radius: 20px;
            padding: clamp(15px, 3vw, 25px);
            width: 100%;
            max-width: 500px;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .control-btn {
            padding: clamp(18px, 4vw, 28px);
            border: none;
            border-radius: 18px;
            font-size: clamp(16px, 3vw, 22px);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            color: white;
            min-height: 60px;
        }

        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .control-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .control-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-team1 { background: #2ecc00; }
        .btn-team2 { background: #ff6d00; }
        .btn-undo { background: #ef5350; }
        .btn-change { background: linear-gradient(90deg, #26c6da, #00acc1); }

        /* Team selected state */
        .btn-team1.selected {
            background: #fdd835 !important;
            color: #2c1b4d !important;
            box-shadow: 0 0 0 4px white, 0 8px 25px rgba(253,216,53,0.5) !important;
        }
        .btn-team2.selected {
            background: #fdd835 !important;
            color: #2c1b4d !important;
            box-shadow: 0 0 0 4px white, 0 8px 25px rgba(253,216,53,0.5) !important;
        }

        .bell-btn {
            width: 100%;
            padding: clamp(14px, 3vw, 22px);
            background: linear-gradient(90deg, #B366FF, #FF5599);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: clamp(14px, 2.5vw, 20px);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .bell-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* Animations */
        @keyframes floatUp {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes floatUpMa {
            0%,100% { transform: translateY(0px) scaleX(1); }
            50% { transform: translateY(-8px) scaleX(1.04); }
        }
        @keyframes glow-yellow {
            0%,100% { filter: drop-shadow(0 0 4px rgba(253,216,53,0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(253,216,53,1)) drop-shadow(0 0 36px rgba(253,216,53,0.6)); }
        }
        @keyframes glow-cyan {
            0%,100% { filter: drop-shadow(0 0 4px rgba(38,198,218,0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(38,198,218,1)) drop-shadow(0 0 36px rgba(38,198,218,0.6)); }
        }
        @keyframes glow-red {
            0%,100% { filter: drop-shadow(0 0 4px rgba(239,83,80,0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(239,83,80,1)) drop-shadow(0 0 36px rgba(239,83,80,0.6)); }
        }

        /* Question Box */
        .question-box {
            background: white;
            border-radius: 20px;
            padding: clamp(15px, 3vw, 25px);
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            border: 4px solid #fdd835;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .question-letter {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 45px;
            height: 45px;
            background: #fdd835;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            color: #2c1b4d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .question-text {
            font-size: clamp(18px, 3.5vw, 24px);
            font-weight: 700;
            color: #2c1b4d;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .question-answer {
            font-size: clamp(16px, 3vw, 20px);
            font-weight: 900;
            color: #ef5350;
            display: block;
        }

        .loading-text {
            color: #666;
            font-style: italic;
            font-size: 18px;
        }

        .instruction {
            color: rgba(255,255,255,0.8);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: -5px;
        }

        /* Buzzer Alert Overlay */
        .buzzer-alert-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            width: 90%;
            max-width: 400px;
            z-index: 1000;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .buzzer-alert-container.active {
            transform: translateX(-50%) translateY(0);
        }

        .buzzer-alert {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border-bottom: 5px solid #ddd;
        }

        .buzzer-alert.green { border-bottom-color: #2ecc00; }
        .buzzer-alert.orange { border-bottom-color: #ff6d00; }

        .buzzer-alert-icon {
            font-size: 30px;
            animation: bell-shake 0.5s infinite;
        }

        .buzzer-alert-info {
            flex: 1;
            text-align: right;
        }

        .buzzer-alert-text {
            font-size: 14px;
            color: #666;
            font-weight: 700;
        }

        .buzzer-alert-team {
            font-size: 20px;
            font-weight: 900;
        }

        .buzzer-alert-team.green { color: #2ecc00; }
        .buzzer-alert-team.orange { color: #ff6d00; }

        .buzzer-alert-player {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }

        @keyframes bell-shake {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }

        /* Responsive - Mobile Full Screen - No Scroll */
        @media (max-width: 500px), (max-height: 600px) {
            html, body {
                height: 100%;
                min-height: 100vh;
                min-height: 100dvh;
                padding: 4px 3px;
                overflow: hidden;
            }

            body {
                justify-content: flex-start;
                gap: 3px;
            }

            .content {
                gap: 4px;
                width: 100%;
                max-width: 100%;
                height: 100%;
            }

            .logo-stack {
                transform: scale(0.55);
                transform-origin: top center;
            }

            .presenter-label {
                margin-top: 0;
                font-size: 13px;
            }

            .score-section {
                gap: 10px;
                width: 100%;
                justify-content: center;
            }

            .score-box {
                width: 50px;
                height: 50px;
                font-size: 24px;
                border-radius: 10px;
            }

            .team-label {
                font-size: 11px;
            }

            .instruction {
                display: none;
            }

            .question-box {
                padding: 10px 12px;
                border-radius: 12px;
            }

            .question-letter {
                font-size: 24px;
                margin-bottom: 5px;
            }

            .question-text {
                font-size: 14px;
                margin-bottom: 8px;
            }

            .question-answer {
                font-size: 16px;
            }

            .hex-board {
                max-width: 100%;
                flex: 1;
                min-height: 0;
                padding: 8px;
                border-radius: 15px;
            }

            .control-panel {
                max-width: 100%;
                padding: 6px;
                gap: 6px;
                border-radius: 15px;
            }

            /* الأزرار أكبر على الهاتف */
            .control-btn {
                padding: 12px 8px;
                font-size: 14px;
                min-height: 50px;
                border-radius: 10px;
            }

            .bell-btn {
                padding: 12px 8px;
                font-size: 14px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Hex Background -->
    <div class="hex-bg">
        <svg xmlns="http://www.w3.org/2000/svg" id="hex-pattern-svg"></svg>
    </div>

    <!-- Content -->
    <div class="content">
        <!-- Logo -->
        <div class="logo-stack">
            <span class="logo-word logo-huroof">حروف</span>
            <span class="logo-word logo-ma">مع</span>
            <span class="logo-word logo-marah" id="logoName">مراح</span>
        </div>

        <!-- Score Section -->
        <div class="score-section">
            <div class="score-card">
                <div class="team-label green" id="team1Label">الفريق الأول</div>
                <div class="score-box green-score" id="score1">0</div>
            </div>
            <div class="score-card">
                <div class="team-label orange" id="team2Label">الفريق الثاني</div>
                <div class="score-box orange-score" id="score2">0</div>
            </div>
        </div>

        <!-- Question Display -->
        <div class="question-box" id="questionBox">
            <div class="loading-text">جاري تحميل الأسئلة...</div>
        </div>

        <!-- Hex Board -->
        <div class="hex-board">
            <svg viewBox="0 0 400 400" id="board"></svg>
        </div>

        <!-- Buzzer Alert - Shows only when someone buzzes -->
        <div class="buzzer-alert-container" id="buzzerAlert">
            <div class="buzzer-alert">
                <div class="buzzer-alert-icon">🔔</div>
                <div class="buzzer-alert-info">
                    <div class="buzzer-alert-text">ضغط الجرس!</div>
                    <div class="buzzer-alert-team" id="buzzerAlertTeam"></div>
                    <div class="buzzer-alert-player" id="buzzerAlertPlayer"></div>
                </div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="control-grid">
                <button class="control-btn btn-team1" id="btnTeam1" onclick="selectTeam('green')" disabled>
                    <span id="btnTeam1Text">الفريق الأول</span>
                </button>
                <button class="control-btn btn-team2" id="btnTeam2" onclick="selectTeam('orange')" disabled>
                    <span id="btnTeam2Text">الفريق الثاني</span>
                </button>
                <button class="control-btn btn-undo" id="btnUndo" onclick="undoSelection()" disabled>
                    إلغاء التحديد
                </button>
                <button class="control-btn btn-change" id="btnChangeQuestion" onclick="changeQuestion()" disabled>
                    تغيير السؤال
                </button>
            </div>

            <button class="bell-btn" onclick="resetBuzzFromPresenter()">
                إعادة تعيين الجرس
            </button>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        // Hex Pattern
        function drawHexPattern(svgEl) {
            const R = 50;
            const w = Math.sqrt(3) * R;
            const h = 2 * R;
            const cols = Math.ceil(window.innerWidth / w) + 2;
            const rows = Math.ceil(window.innerHeight / (h * 0.75)) + 2;
            let d = '';
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cx = c * w + (r % 2 === 1 ? w / 2 : 0);
                    const cy = r * h * 0.75;
                    let pts = '';
                    for (let i = 0; i < 6; i++) {
                        const a = Math.PI / 180 * (60 * i - 30);
                        pts += (i === 0 ? 'M' : 'L') + (cx + R * Math.cos(a)).toFixed(1) + ',' + (cy + R * Math.sin(a)).toFixed(1);
                    }
                    d += pts + 'Z ';
                }
            }
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', d);
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', 'white');
            path.setAttribute('stroke-width', '2');
            svgEl.appendChild(path);
        }
        drawHexPattern(document.getElementById('hex-pattern-svg'));

        /* ===== SESSION MANAGEMENT ===== */
        const urlParams = new URLSearchParams(window.location.search);
        let sessionId = urlParams.get('session');
        if (!sessionId) {
            sessionId = Math.random().toString(36).substring(2, 11);
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?session=' + sessionId;
            window.history.replaceState({path:newUrl}, '', newUrl);
        }

        /* ===== Supabase Setup ===== */
        const supabaseUrl = 'https://rzblwgdvtiafqzhvcavr.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6Ymx3Z2R2dGlhZnF6aHZjYXZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMTMwMzcsImV4cCI6MjA5MTU4OTAzN30.Dy2ZkzPykeKs55ZVKw5wK_ghhBs8Ibk_-5IHfEJnPE0';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
        const channel = _supabase.channel('huroof_' + sessionId);

        channel
            .on('broadcast', { event: 'game_state' }, payload => {
                applyGameState(payload.payload);
            })
            .on('broadcast', { event: 'letters_update' }, payload => {
                if (payload.payload.sessionId === sessionId) {
                    letters = payload.payload.letters;
                    rebuildBoardWithLetters();
                }
            })
            .on('broadcast', { event: 'player_buzz' }, payload => {
                const buzz = payload.payload;
                if (buzz.active && (!currentBuzz || currentBuzz.timestamp !== buzz.timestamp)) {
                    currentBuzz = buzz;
                    showBuzzerAlert(buzz);
                }
            })
            .on('broadcast', { event: 'buzzer_locked' }, payload => {
                const lock = payload.payload;
                if (lock.locked && (!currentBuzz || currentBuzz.timestamp !== lock.timestamp)) {
                    currentBuzz = {
                        name: lock.playerName, teamName: lock.teamName, timestamp: lock.timestamp, active: true,
                        team: lock.team || (lock.teamName === settings.team1 ? 'green' : 'orange')
                    };
                    showBuzzerAlert(currentBuzz);
                }
            })
            .on('broadcast', { event: 'reset_buzz' }, payload => {
                if (payload.payload.reset) {
                    document.getElementById('buzzerAlert').classList.remove('active');
                    currentBuzz = null;
                }
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    channel.send({ type: 'broadcast', event: 'request_sync', payload: { timestamp: Date.now() } });
                }
            });

        // Game State
        let letters = ["أ","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن"];
        let cells = [];
        let selectedCell = null;
        let greenScore = 0, orangeScore = 0, currentRound = 1;
        let lastGreenPath = false, lastOrangePath = false;
        let questionsData = {}, usedQuestions = {}, currentQuestionLetter = null;

        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1Hcb18FCPMzLibTjyN_9Qqgklsla4AaZS_k8cngBYZG8/export?format=csv&gid=1257728758';

        async function fetchQuestions() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                parseCSV(csvText);
                document.getElementById('questionBox').innerHTML = '<div class="loading-text">اختر حرفاً من اللوحة</div>';
            } catch (error) {
                document.getElementById('questionBox').innerHTML = '<div class="loading-text">تعذر تحميل الأسئلة</div>';
            }
        }

        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            questionsData = {};
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim(); if (!line) continue;
                const cols = parseCSVLine(line);
                if (cols.length >= 2) {
                    const question = cols[1].trim(), answer = cols[2].trim();
                    if (answer && question) {
                        const firstLetter = answer.charAt(0);
                        if (!questionsData[firstLetter]) { questionsData[firstLetter] = []; usedQuestions[firstLetter] = []; }
                        if (!questionsData[firstLetter].some(q => q.answer === answer)) { questionsData[firstLetter].push({ question, answer }); }
                    }
                }
            }
        }

        function parseCSVLine(line) {
            const result = []; let current = '', inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim()); return result;
        }

        function getRandomQuestion(letter) {
            const questions = questionsData[letter] || [];
            if (questions.length === 0) return { question: 'لا توجد أسئلة لهذا الحرف', answer: '' };
            const available = questions.filter((q, i) => !usedQuestions[letter].includes(i));
            if (available.length === 0) { usedQuestions[letter] = []; return questions[Math.floor(Math.random() * questions.length)]; }
            const randomQ = available[Math.floor(Math.random() * available.length)];
            usedQuestions[letter].push(questions.indexOf(randomQ)); return randomQ;
        }

        function displayQuestion(letter) {
            const q = getRandomQuestion(letter);
            currentQuestionLetter = letter;
            document.getElementById('questionBox').innerHTML = `
                <div class="question-letter">${letter}</div>
                <div class="question-text">${q.question}</div>
                <div class="question-answer" id="currentAnswer">الإجابة: ${q.answer}</div>
            `;
            document.getElementById('btnChangeQuestion').disabled = false;
        }

        function changeQuestion() {
            if (!currentQuestionLetter) return;
            const q = getRandomQuestion(currentQuestionLetter);
            document.getElementById('questionBox').innerHTML = `
                <div class="question-letter">${currentQuestionLetter}</div>
                <div class="question-text">${q.question}</div>
                <div class="question-answer" id="currentAnswer">الإجابة: ${q.answer}</div>
            `;
            const box = document.getElementById('questionBox');
            box.style.animation = 'none'; box.offsetHeight; box.style.animation = 'fadeIn 0.3s ease-out';
        }

        let settings = { name: 'مراح', team1: 'الفريق الأول', team2: 'الفريق الثاني', rounds: 2 };

        function updateAllLogos() {
            document.getElementById('logoName').textContent = settings.name;
            document.getElementById('team1Label').textContent = settings.team1;
            document.getElementById('team2Label').textContent = settings.team2;
            document.getElementById('btnTeam1Text').textContent = settings.team1;
            document.getElementById('btnTeam2Text').textContent = settings.team2;
        }

        function setTeamButtonsEnabled(enabled) {
            document.getElementById('btnTeam1').disabled = !enabled;
            document.getElementById('btnTeam2').disabled = !enabled;
        }

        function buildBoard() {
            const svg = document.getElementById('board'); svg.innerHTML = ''; cells = [];
            const R = 38, w = Math.sqrt(3) * R, h = 2 * R;
            const startX = 200 - 2 * w - 10, startY = 200 - 2 * h * 0.75 + 5;
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const x = startX + col * w + (row % 2 === 1 ? w / 2 : 0), y = startY + row * h * 0.75;
                    createHexagon(svg, x, y, letters[row * 5 + col], row * 5 + col);
                }
            }
        }

        function createHexagon(svg, x, y, letter, id) {
            const R = 38; const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("class", "hexagon"); g.setAttribute("transform", `translate(${x}, ${y})`); g.setAttribute("data-id", id);
            const points = []; for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 180) * (60 * i - 30); points.push(`${(R * Math.cos(angle)).toFixed(1)},${(R * Math.sin(angle)).toFixed(1)}`);
            }
            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute("points", points.join(" ")); poly.setAttribute("class", "hex-poly");
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("class", "hex-text"); text.setAttribute("dy", "4"); text.textContent = letter;
            g.appendChild(poly); g.appendChild(text);
            const cell = { el: g, owner: null, isPending: false, text: text, row: Math.floor(id / 5), col: id % 5, id: id };
            cells.push(cell); g.onclick = () => selectCell(cell); svg.appendChild(g);
        }

        function selectCell(cell) {
            if (cell.owner) return;
            if (selectedCell && selectedCell !== cell) {
                selectedCell.isPending = false; selectedCell.el.classList.remove('pending-fill');
                broadcastAction({ type: 'cell_unselected', cellId: selectedCell.id });
            }
            const letter = cell.el.querySelector('.hex-text').textContent;
            selectedCell = cell; cell.isPending = true;
            cell.el.classList.remove('green-fill', 'orange-fill'); cell.el.classList.add('pending-fill');
            cell.text.style.display = 'block';
            broadcastAction({ type: 'cell_selected', cellId: cell.id });
            displayQuestion(letter);
            setTeamButtonsEnabled(true);
            document.getElementById('btnUndo').disabled = false;
            document.getElementById('btnTeam1').classList.remove('selected');
            document.getElementById('btnTeam2').classList.remove('selected');
        }

        function selectTeam(team) {
            if (!selectedCell) return;
            const cellId = selectedCell.id;
            selectedCell.isPending = false; selectedCell.el.classList.remove('pending-fill');
            selectedCell.owner = team; selectedCell.el.classList.add(team + '-fill');
            selectedCell.text.style.display = 'none';
            document.getElementById('btnTeam1').classList.remove('selected');
            document.getElementById('btnTeam2').classList.remove('selected');
            setTeamButtonsEnabled(false);
            document.getElementById('btnUndo').disabled = true;
            document.getElementById('btnChangeQuestion').disabled = true;
            currentQuestionLetter = null;
            const answeredCell = selectedCell; selectedCell = null;
            broadcastAction({ type: 'team_selected', cellId: cellId, team: team });
            setTimeout(() => {
                const state = {
                    settings: settings, greenScore: greenScore, orangeScore: orangeScore, currentRound: currentRound,
                    cells: cells.map(c => ({ id: c.id, owner: c.owner, isPending: c.isPending || false })),
                    timestamp: Date.now()
                };
                channel.send({ type: 'broadcast', event: 'game_state', payload: state });
            }, 100);
            resetBuzzFromPresenter();
        }

        function undoSelection() {
            if (selectedCell) {
                const cellId = selectedCell.id;
                selectedCell.isPending = false; selectedCell.el.classList.remove('pending-fill');
                selectedCell = null;
                broadcastAction({ type: 'cell_unselected', cellId: cellId });
            }
            setTeamButtonsEnabled(false);
            document.getElementById('btnUndo').disabled = true;
            document.getElementById('btnChangeQuestion').disabled = true;
            document.getElementById('btnTeam1').classList.remove('selected');
            document.getElementById('btnTeam2').classList.remove('selected');
            document.getElementById('questionBox').innerHTML = '<div class="loading-text">اختر حرفاً من اللوحة</div>';
            currentQuestionLetter = null;
        }

        function resetGame() {
            greenScore = 0; orangeScore = 0; currentRound = 1; selectedCell = null;
            document.getElementById('score1').textContent = '0';
            document.getElementById('score2').textContent = '0';
            setTeamButtonsEnabled(false);
            document.getElementById('btnUndo').disabled = true;
            document.getElementById('btnChangeQuestion').disabled = true;
            buildBoard();
        }

        updateAllLogos(); fetchQuestions(); buildBoard();

        function rebuildBoardWithLetters() {
            const svg = document.getElementById('board'); svg.innerHTML = ''; cells = [];
            const R = 38, w = Math.sqrt(3) * R, h = 2 * R;
            const startX = 200 - 2 * w - 10, startY = 200 - 2 * h * 0.75 + 5;
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const x = startX + col * w + (row % 2 === 1 ? w / 2 : 0), y = startY + row * h * 0.75;
                    createHexagon(svg, x, y, letters[row * 5 + col], row * 5 + col);
                }
            }
        }

        function applyGameState(state) {
            if (state.settings) { settings = { ...settings, ...state.settings }; updateAllLogos(); }
            if (state.greenScore !== undefined) { greenScore = state.greenScore; document.getElementById('score1').textContent = greenScore; }
            if (state.orangeScore !== undefined) { orangeScore = state.orangeScore; document.getElementById('score2').textContent = orangeScore; }
            if (state.cells && state.cells.length > 0) {
                state.cells.forEach(cellData => {
                    const cell = cells[cellData.id];
                    if (cell) {
                        cell.owner = cellData.owner; cell.isPending = cellData.isPending || false;
                        cell.el.classList.remove('green-fill', 'orange-fill', 'pending-fill');
                        if (cell.owner) { cell.el.classList.add(cell.owner + '-fill'); cell.text.style.display = 'none'; }
                        else if (cell.isPending) { cell.el.classList.add('pending-fill'); cell.text.style.display = 'block'; }
                        else cell.text.style.display = 'block';
                    }
                });
            }
        }

        function broadcastAction(action) {
            channel.send({ type: 'broadcast', event: 'presenter_action', payload: action });
        }

        const originalResetGame = resetGame;
        resetGame = function() { originalResetGame(); broadcastAction({ type: 'game_reset' }); };

        let currentBuzz = null;
        function showBuzzerAlert(buzz) {
            const container = document.getElementById('buzzerAlert');
            const teamEl = document.getElementById('buzzerAlertTeam');
            const playerEl = document.getElementById('buzzerAlertPlayer');
            container.classList.remove('green', 'orange');
            teamEl.textContent = buzz.teamName;
            teamEl.className = 'buzzer-alert-team ' + buzz.team;
            playerEl.textContent = buzz.name;
            container.classList.add(buzz.team);
            document.getElementById('buzzerAlert').parentElement.classList.add('active');
            playBell();
        }

        function resetBuzzFromPresenter() {
            document.getElementById('buzzerAlert').parentElement.classList.remove('active');
            currentBuzz = null;
            channel.send({ type: 'broadcast', event: 'reset_buzz', payload: { reset: true, timestamp: Date.now() } });
        }

        function playBell() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.8, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0);
                osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 1.0);
            } catch (e) {}
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المقدم - حروف مع مراح</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script src="../firebase-config.js"></script>
    <style>
        @font-face {
            font-family: 'AA-GALAXY';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXY.otf');
        }
        @font-face {
            font-family: 'AA-GALAXY-BOLD';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXYBold.otf');
        }
        * {
            font-family: 'AA-GALAXY-BOLD', 'AA-GALAXY', sans-serif !important;
            box-sizing: border-box; margin: 0; padding: 0;
        }

        html, body {
            overflow: auto;
            height: auto;
        }

        body {
            background: #6a3093;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            gap: 15px;
            position: relative;
        }

        /* Hex Background */
        .hex-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #6a3093;
            overflow: hidden;
            z-index: 0;
        }
        .hex-bg svg {
            width: 100%;
            height: 100%;
            opacity: 0.18;
        }

        /* Content Container */
        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
            padding-bottom: 15px;
        }

        /* Logo Stack */
        .logo-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
            pointer-events: none;
        }
        .logo-word {
            font-weight: 900;
            text-align: center;
            display: inline-block;
        }

        .logo-huroof {
            color: #fdd835;
            font-size: clamp(40px, 7vw, 70px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 6px 6px 0 #2c1b4d,
                7px 7px 0 #2c1b4d, 8px 8px 0 #2c1b4d, 10px 10px 15px rgba(0,0,0,0.6);
            animation: floatUp 4s ease-in-out infinite, glow-yellow 4s ease-in-out infinite;
        }
        .logo-ma {
            color: #26c6da;
            font-size: clamp(30px, 5vw, 55px);
            letter-spacing: clamp(8px, 1.5vw, 15px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 7px 7px 15px rgba(0,0,0,0.6);
            animation: floatUpMa 4s ease-in-out 0.5s infinite, glow-cyan 4s ease-in-out 0.5s infinite;
        }
        .logo-marah {
            color: #ef5350;
            font-size: clamp(40px, 7vw, 70px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 6px 6px 0 #2c1b4d,
                7px 7px 0 #2c1b4d, 8px 8px 0 #2c1b4d, 10px 10px 15px rgba(0,0,0,0.6);
            animation: floatUp 4s ease-in-out 1s infinite, glow-red 4s ease-in-out 1s infinite;
        }

        .presenter-label {
            color: white;
            font-size: clamp(18px, 3vw, 28px);
            font-weight: 900;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            margin-top: 5px;
        }

        /* Score Section */
        .score-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(20px, 5vw, 50px);
            width: 100%;
        }

        .score-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .team-label {
            font-size: clamp(14px, 2.5vw, 22px);
            font-weight: 900;
            text-align: center;
            max-width: clamp(80px, 12vw, 130px);
            word-break: break-word;
        }

        .team-label.green { color: #2ecc00; }
        .team-label.orange { color: #ff6d00; }

        .score-box {
            width: clamp(55px, 10vw, 90px);
            height: clamp(55px, 10vw, 90px);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 900;
            color: white;
            border-radius: clamp(12px, 2vw, 20px);
        }

        .green-score {
            background: #2ecc00;
            box-shadow: 0 4px 15px rgba(46, 204, 0, 0.4);
        }
        .orange-score {
            background: #ff6d00;
            box-shadow: 0 4px 15px rgba(255, 109, 0, 0.4);
        }

        /* Hex Board */
        .hex-board {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: conic-gradient(from 45deg, #2ecc00 90deg, #ff6d00 90deg 180deg, #2ecc00 180deg 270deg, #ff6d00 270deg);
            border-radius: 20px;
            padding: 20px;
            overflow: visible;
        }

        .hex-board svg {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: visible;
        }

        .hexagon {
            cursor: pointer;
        }
        .hex-poly {
            stroke: #6a3093;
            stroke-width: 6;
            stroke-linejoin: round;
            fill: white;
            transition: fill 0.3s;
        }
        .hex-text {
            font-size: clamp(24px, 4vw, 38px);
            font-weight: 900;
            fill: #6a3093;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: central;
        }

        /* Pending state - yellow glow */
        .pending-fill .hex-poly {
            fill: #fdd835 !important;
        }
        .pending-fill .hex-text {
            fill: #2c1b4d !important;
        }

        /* Team fills */
        .green-fill .hex-poly { fill: #2ecc00 !important; }
        .orange-fill .hex-poly { fill: #ff6d00 !important; }
        .green-fill .hex-text,
        .orange-fill .hex-text { fill: white !important; }

        /* Control Panel */
        .control-panel {
            background: #2c1b4d;
            border-radius: 20px;
            padding: clamp(15px, 3vw, 25px);
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .control-btn {
            padding: clamp(18px, 4vw, 28px);
            border: none;
            border-radius: 18px;
            font-size: clamp(16px, 3vw, 22px);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            color: white;
            min-height: 60px;
        }

        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .control-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .control-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-team1 { background: #2ecc00; }
        .btn-team2 { background: #ff6d00; }
        .btn-undo { background: #ef5350; }
        .btn-change { background: linear-gradient(90deg, #26c6da, #00acc1); }

        /* Team selected state */
        .btn-team1.selected {
            background: #fdd835 !important;
            color: #2c1b4d !important;
            box-shadow: 0 0 0 4px white, 0 8px 25px rgba(253,216,53,0.5) !important;
        }
        .btn-team2.selected {
            background: #fdd835 !important;
            color: #2c1b4d !important;
            box-shadow: 0 0 0 4px white, 0 8px 25px rgba(253,216,53,0.5) !important;
        }

        .bell-btn {
            width: 100%;
            padding: clamp(14px, 3vw, 22px);
            background: linear-gradient(90deg, #B366FF, #FF5599);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: clamp(14px, 2.5vw, 20px);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .bell-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* Animations */
        @keyframes floatUp {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes floatUpMa {
            0%,100% { transform: translateY(0px) scaleX(1); }
            50% { transform: translateY(-8px) scaleX(1.04); }
        }
        @keyframes glow-yellow {
            0%,100% { filter: drop-shadow(0 0 4px rgba(253,216,53,0.3)); }
            50% { filter: drop-shadow(0 0 12px rgba(253,216,53,0.8)); }
        }
        @keyframes glow-cyan {
            0%,100% { filter: drop-shadow(0 0 4px rgba(38,198,218,0.3)); }
            50% { filter: drop-shadow(0 0 12px rgba(38,198,218,0.8)); }
        }
        @keyframes glow-red {
            0%,100% { filter: drop-shadow(0 0 4px rgba(239,83,80,0.3)); }
            50% { filter: drop-shadow(0 0 12px rgba(239,83,80,0.8)); }
        }

        /* Question Box */
        .question-box {
            background: #2c1b4d;
            border-radius: 20px;
            padding: clamp(20px, 4vw, 35px);
            width: 100%;
            max-width: 500px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .question-letter {
            font-size: clamp(50px, 8vw, 80px);
            font-weight: 900;
            color: #fdd835;
            line-height: 1;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: clamp(20px, 4vw, 32px);
            font-weight: 700;
            color: white;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .question-answer {
            font-size: clamp(18px, 3vw, 26px);
            font-weight: 700;
            color: #26c6da;
            padding: 10px 25px;
            background: rgba(38, 198, 218, 0.1);
            border-radius: 12px;
            display: none;
        }

        .question-box.revealed .question-answer {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .loading-text {
            font-size: 24px;
            color: white;
            opacity: 0.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Buzzer Alert on Presenter */
        .buzzer-alert {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #2c1b4d;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
            animation: fadeIn 0.3s ease-out;
        }
        .buzzer-alert.active { display: flex; }
        .buzzer-alert-title { font-size: 24px; color: white; opacity: 0.8; }
        .buzzer-alert-team {
            font-size: 45px; font-weight: 900;
            padding: 10px 30px; border-radius: 50px;
            color: white;
        }
        .buzzer-alert.green .buzzer-alert-team { background: #2ecc00; box-shadow: 0 0 30px rgba(46, 204, 0, 0.5); }
        .buzzer-alert.orange .buzzer-alert-team { background: #ff6d00; box-shadow: 0 0 30px rgba(255, 109, 0, 0.5); }
        .buzzer-alert-player { font-size: 35px; color: #fdd835; font-weight: 900; }

        .instruction {
            color: white; font-size: 20px; font-weight: 900; opacity: 0.8;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="hex-bg">
        <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
            <pattern id="hexagons" width="10" height="17.32" patternUnits="userSpaceOnUse" patternTransform="scale(1.2)">
                <path d="M5 0 L10 2.88 L10 8.66 L5 11.54 L0 8.66 L0 2.88 Z" fill="none" stroke="currentColor" stroke-width="0.15" />
            </pattern>
            <rect width="100%" height="100%" fill="url(#hexagons)" />
        </svg>
    </div>

    <div class="content">
        <div class="logo-stack">
            <span class="logo-word logo-huroof">حروف</span>
            <span class="logo-word logo-ma">مـع</span>
            <span class="logo-word logo-marah" id="logoName">مراح</span>
        </div>
        <div class="presenter-label">شاشة المقدم</div>

        <div class="score-section">
            <div class="score-card">
                <div class="team-label green" id="team1Label">الفريق الأول</div>
                <div class="score-box green-score" id="score1">0</div>
            </div>
            <div class="score-card">
                <div class="team-label orange" id="team2Label">الفريق الثاني</div>
                <div class="score-box orange-score" id="score2">0</div>
            </div>
        </div>

        <div class="hex-board">
            <svg id="board" viewBox="0 0 400 400"></svg>
        </div>

        <div class="instruction" id="instruction">اختر حرفاً من اللوحة</div>

        <div class="question-box" id="questionBox" onclick="this.classList.toggle('revealed')">
            <div class="loading-text">اختر حرفاً من اللوحة</div>
            <div class="buzzer-alert" id="buzzerAlert">
                <div class="buzzer-alert-title">رنة جرس!</div>
                <div class="buzzer-alert-team" id="buzzerAlertTeam">الفريق</div>
                <div class="buzzer-alert-player" id="buzzerAlertPlayer">اسم اللاعب</div>
                <button class="control-btn" style="background: rgba(255,255,255,0.1); margin-top: 10px;" onclick="event.stopPropagation(); resetBuzzFromPresenter();">متابعة</button>
            </div>
        </div>

        <div class="control-panel">
            <div class="control-grid">
                <button class="control-btn btn-team1" id="btnTeam1" onclick="selectTeam('green')" disabled>
                    <span id="btnTeam1Text">الفريق الأول</span>
                </button>
                <button class="control-btn btn-team2" id="btnTeam2" onclick="selectTeam('orange')" disabled>
                    <span id="btnTeam2Text">الفريق الثاني</span>
                </button>
                <button class="control-btn btn-undo" id="btnUndo" onclick="unselectCell()" disabled>تراجع</button>
                <button class="control-btn btn-change" id="btnChangeQuestion" onclick="changeQuestion()" disabled>تغيير السؤال</button>
            </div>
            <button class="bell-btn" onclick="playBell()">🔔 جرس التنبيه</button>
        </div>
    </div>

    <script>
        /* ===== SESSION MANAGEMENT ===== */
        const sessionId = new URLSearchParams(window.location.search).get('session');
        if (!sessionId) {
            alert('خطأ: لا يوجد معرف للجلسة. يرجى فتح اللعبة الرئيسية أولاً.');
        }

        /* ===== QUESTIONS DATA ===== */
        let questionsData = {};
        let usedQuestions = {};

        async function fetchQuestions() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/the9988/Huroof-Game/main/questions.json');
                questionsData = await response.json();
                Object.keys(questionsData).forEach(letter => { usedQuestions[letter] = []; });
            } catch (error) {
                console.error('Error loading questions:', error);
            }
        }

        function getRandomQuestion(letter) {
            const questions = questionsData[letter] || [];
            if (questions.length === 0) return { question: 'لا توجد أسئلة لهذا الحرف', answer: '' };
            const available = questions.filter((q, i) => !usedQuestions[letter].includes(i));
            if (available.length === 0) { usedQuestions[letter] = []; return questions[Math.floor(Math.random() * questions.length)]; }
            const randomQ = available[Math.floor(Math.random() * available.length)];
            usedQuestions[letter].push(questions.indexOf(randomQ));
            return randomQ;
        }

        function displayQuestion(letter) {
            const q = getRandomQuestion(letter);
            currentQuestionLetter = letter;
            const qBox = document.getElementById('questionBox');
            qBox.classList.remove('revealed');
            qBox.innerHTML = `<div class="question-letter">${letter}</div><div class="question-text">${q.question}</div><div class="question-answer" id="currentAnswer">الإجابة: ${q.answer}</div><div class="buzzer-alert" id="buzzerAlert"><div class="buzzer-alert-title">رنة جرس!</div><div class="buzzer-alert-team" id="buzzerAlertTeam">الفريق</div><div class="buzzer-alert-player" id="buzzerAlertPlayer">اسم اللاعب</div><button class="control-btn" style="background: rgba(255,255,255,0.1); margin-top: 10px;" onclick="event.stopPropagation(); resetBuzzFromPresenter();">متابعة</button></div>`;
            document.getElementById('btnChangeQuestion').disabled = false;
        }

        function changeQuestion() {
            if (!currentQuestionLetter) return;
            displayQuestion(currentQuestionLetter);
        }

        /* ===== STATE ===== */
        let settings = { name: 'مراح', team1: 'الفريق الأول', team2: 'الفريق الثاني', rounds: 2 };
        let greenScore = 0, orangeScore = 0, currentRound = 1, letters = [], cells = [], selectedCell = null, currentQuestionLetter = null;

        function updateAllLogos() {
            document.getElementById('logoName').textContent = settings.name;
            document.getElementById('team1Label').textContent = settings.team1;
            document.getElementById('team2Label').textContent = settings.team2;
            document.getElementById('btnTeam1Text').textContent = settings.team1;
            document.getElementById('btnTeam2Text').textContent = settings.team2;
        }

        function buildBoard() {
            const svg = document.getElementById('board');
            svg.innerHTML = ''; cells = [];
            const R = 38, w = Math.sqrt(3) * R, h = 2 * R;
            const sx = 200 - 2 * w - 10, sy = 200 - 2 * h * 0.75 + 5;
            for (let row = 0; row < 5; row++) for (let col = 0; col < 5; col++) {
                const x = sx + col * w + (row % 2 === 1 ? w / 2 : 0), y = sy + row * h * 0.75;
                const id = row * 5 + col;
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", "hexagon");
                g.onclick = () => onCellClick(id);
                const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
                p.setAttribute("class", "hex-poly");
                let d = ""; for (let i = 0; i < 6; i++) { const ang = Math.PI / 180 * (i * 60 - 30); d += (i === 0 ? "M" : "L") + (x + R * Math.cos(ang)) + "," + (y + R * Math.sin(ang)); }
                p.setAttribute("d", d + "Z");
                const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t.setAttribute("class", "hex-text"); t.setAttribute("x", x); t.setAttribute("y", y);
                t.textContent = letters[id] || "";
                g.appendChild(p); g.appendChild(t); svg.appendChild(g);
                cells.push({ id, row, col, el: g, text: t, owner: null });
            }
        }

        function onCellClick(id) {
            const cell = cells[id];
            if (cell.owner) return;
            if (selectedCell) {
                selectedCell.el.classList.remove('pending-fill');
                if (selectedCell.id === id) { selectedCell = null; unselectCell(); return; }
            }
            selectedCell = cell;
            cell.el.classList.add('pending-fill');
            displayQuestion(cell.text.textContent);
            document.getElementById('btnTeam1').disabled = false;
            document.getElementById('btnTeam2').disabled = false;
            document.getElementById('btnUndo').disabled = false;
            document.getElementById('instruction').textContent = 'اختر الفريق للإجابة';
            firebaseUpdate('games/' + sessionId + '/presenterActions', { type: 'cell_selected', cellId: id });
        }

        function unselectCell() {
            if (selectedCell) {
                const cid = selectedCell.id;
                selectedCell.el.classList.remove('pending-fill');
                selectedCell = null;
                firebaseUpdate('games/' + sessionId + '/presenterActions', { type: 'cell_unselected', cellId: cid });
            }
            document.getElementById('btnTeam1').disabled = true;
            document.getElementById('btnTeam2').disabled = true;
            document.getElementById('btnUndo').disabled = true;
            document.getElementById('btnChangeQuestion').disabled = true;
            document.getElementById('questionBox').innerHTML = '<div class="loading-text">اختر حرفاً من اللوحة</div>';
            document.getElementById('instruction').textContent = 'اختر حرفاً من اللوحة';
        }

        function selectTeam(team) {
            if (!selectedCell) return;
            const cid = selectedCell.id;
            firebaseUpdate('games/' + sessionId + '/presenterActions', { type: 'team_selected', cellId: cid, team: team });
            unselectCell();
            resetBuzzFromPresenter();
        }

        function resetBuzzFromPresenter() {
            document.getElementById('buzzerAlert').classList.remove('active');
            firebaseRemove('games/' + sessionId + '/playerBuzz');
            firebaseRemove('games/' + sessionId + '/buzzerLocked');
            firebaseUpdate('games/' + sessionId + '/resetBuzz', { reset: true, timestamp: Date.now() });
        }

        function playBell() {
            const btn = document.querySelector('.bell-btn');
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => btn.style.transform = '', 100);
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.8, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0);
                osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 1.0);
            } catch (e) {}
        }

        /* ===== FIREBASE SYNC ===== */
        firebaseListener('games/' + sessionId + '/settings', (fbSettings) => { if (fbSettings) { settings = fbSettings; updateAllLogos(); } });
        firebaseListener('games/' + sessionId + '/letters', (fbLetters) => { if (fbLetters) { letters = fbLetters; buildBoard(); } });
        firebaseListener('games/' + sessionId + '/gameState', (state) => {
            if (state) {
                greenScore = state.greenScore; orangeScore = state.orangeScore;
                document.getElementById('score1').textContent = greenScore;
                document.getElementById('score2').textContent = orangeScore;
                if (state.cells) {
                    state.cells.forEach(cData => {
                        const cell = cells[cData.id];
                        if (cell) {
                            cell.owner = cData.owner; cell.isPending = cData.isPending;
                            cell.el.classList.remove('green-fill', 'orange-fill', 'pending-fill');
                            if (cell.owner) { cell.el.classList.add(cell.owner + '-fill'); cell.text.style.display = 'none'; }
                            else if (cell.isPending) { cell.el.classList.add('pending-fill'); cell.text.style.display = 'block'; }
                            else { cell.text.style.display = 'block'; }
                        }
                    });
                }
            }
        });
        firebaseListener('games/' + sessionId + '/playerBuzz', (buzz) => {
            if (buzz && buzz.active) {
                const alert = document.getElementById('buzzerAlert');
                document.getElementById('buzzerAlertTeam').textContent = buzz.teamName;
                document.getElementById('buzzerAlertTeam').className = 'buzzer-alert-team ' + buzz.team;
                document.getElementById('buzzerAlertPlayer').textContent = buzz.name;
                alert.classList.remove('green', 'orange'); alert.classList.add(buzz.team); alert.classList.add('active');
                playBell();
            }
        });

        fetchQuestions();
    </script>
</body>
</html>

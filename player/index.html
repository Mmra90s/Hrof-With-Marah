<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شاشة اللاعب - حروف مع مراح</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @font-face {
            font-family: 'AA-GALAXY';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXY.otf');
        }
        @font-face {
            font-family: 'AA-GALAXY-BOLD';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXYBold.otf');
        }
        * {
            font-family: 'AA-GALAXY-BOLD', 'AA-GALAXY', sans-serif !important;
            box-sizing: border-box; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #6a3093;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
        }

        /* Hex Background */
        .hex-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #6a3093;
            overflow: hidden;
            z-index: 0;
        }
        .hex-bg svg {
            width: 100%; height: 100%;
            opacity: 0.15;
        }

        /* Screens */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            z-index: 1;
            animation: fadeIn 0.5s ease-out;
        }
        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Registration Form */
        .reg-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.85;
            margin-bottom: 10px;
        }
        .logo-word { font-weight: 900; text-align: center; }
        .logo-huroof { color: #fdd835; font-size: 50px; text-shadow: 2px 2px 0 #2c1b4d; }
        .logo-ma { color: #26c6da; font-size: 25px; letter-spacing: 10px; margin-right: 10px; }
        .logo-marah { color: #ef5350; font-size: 50px; text-shadow: 2px 2px 0 #2c1b4d; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-group label {
            font-weight: 900;
            color: #2c1b4d;
            font-size: 16px;
        }
        .input-group input {
            padding: 12px;
            border: 3px solid #eee;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            outline: none;
            text-align: center;
        }
        .input-group input:focus { border-color: #6a3093; }

        .team-choice {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .team-btn {
            padding: 15px 10px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 900;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .team-btn.green { background: #2ecc00; box-shadow: 0 5px 0 #27ae60; }
        .team-btn.orange { background: #ff6d00; box-shadow: 0 5px 0 #e67e22; }
        .team-btn.selected {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
            outline: 4px solid #fdd835;
        }
        .team-btn:not(.selected) { opacity: 0.6; }

        .confirm-btn {
            padding: 15px;
            background: #6a3093;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
        }
        .confirm-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* Buzzer Screen */
        .player-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }
        .player-info { display: flex; flex-direction: column; }
        .player-name { color: white; font-size: 18px; font-weight: 900; }
        .player-team-display { font-size: 14px; font-weight: 700; }
        .player-team-display.green { color: #2ecc00; }
        .player-team-display.orange { color: #ff6d00; }

        .buzzer-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .buzzer-btn {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #ff5252, #b71c1c);
            border: 10px solid #801313;
            border-radius: 50%;
            box-shadow: 0 15px 0 #600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            position: relative;
        }
        .buzzer-btn:active, .buzzer-btn.pressed {
            transform: translateY(10px);
            box-shadow: 0 5px 0 #600;
            background: radial-gradient(circle, #ff1744, #d50000);
        }
        .buzzer-btn::after {
            content: 'اضغط!';
            color: white;
            font-size: 40px;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .edit-btn {
            margin-top: 40px;
            background: none;
            border: 2px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.6);
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Buzz Status Overlay */
        .buzz-status {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .buzz-status.active { display: flex; }
        .buzz-status-icon { font-size: 100px; margin-bottom: 20px; animation: pulse 1s infinite; }
        .buzz-status-text { color: white; font-size: 32px; font-weight: 900; text-align: center; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Connection Status */
        .connection-status {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
            z-index: 10;
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .status-dot.connected { background: #2ecc00; box-shadow: 0 0 10px #2ecc00; }
        .status-dot.disconnected { background: #ef5350; box-shadow: 0 0 10px #ef5350; }
        .status-text { color: white; font-size: 12px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="hex-bg">
        <svg xmlns="http://www.w3.org/2000/svg" id="hex-pattern-svg"></svg>
    </div>

    <!-- Registration Screen -->
    <div class="screen active" id="screen-reg">
        <div class="reg-card">
            <div class="logo-stack">
                <span class="logo-word logo-huroof">حروف</span>
                <span class="logo-word logo-ma">مع</span>
                <span class="logo-word logo-marah" id="logoName">مراح</span>
            </div>
            <div class="input-group">
                <label>اسمك</label>
                <input type="text" id="playerName" placeholder="اكتب اسمك هنا..." oninput="validateForm()">
            </div>
            <div class="input-group">
                <label>اختر فريقك</label>
                <div class="team-choice">
                    <button class="team-btn green" id="btn-green" onclick="selectTeam('green')">
                        <i class="fas fa-leaf"></i>
                        <span id="team1Name">الفريق الأول</span>
                    </button>
                    <button class="team-btn orange" id="btn-orange" onclick="selectTeam('orange')">
                        <i class="fas fa-fire"></i>
                        <span id="team2Name">الفريق الثاني</span>
                    </button>
                </div>
            </div>
            <button class="confirm-btn" id="confirmBtn" onclick="confirmRegistration()" disabled>دخول اللعبة</button>
        </div>
    </div>

    <!-- Buzzer Screen -->
    <div class="screen" id="screen-buzzer">
        <div class="player-header">
            <div class="player-info">
                <div class="player-name" id="display-name">اسم اللاعب</div>
                <div class="player-team-display" id="display-team">الفريق الأول</div>
            </div>
            <div class="logo-stack" style="margin:0; transform: scale(0.4);">
                <span class="logo-word logo-huroof">حروف</span>
                <span class="logo-word logo-marah" id="logoNameBuzzer">مراح</span>
            </div>
        </div>
        <div class="buzzer-container">
            <button class="buzzer-btn" id="buzzerBtn" onclick="pressBuzzer()"></button>
            <button class="edit-btn" onclick="editPlayer()">تغيير الفريق أو الاسم</button>
        </div>
    </div>

    <!-- Buzz Status Overlay -->
    <div class="buzz-status" id="buzzStatus">
        <div class="buzz-status-icon">🔔</div>
        <div class="buzz-status-text" id="buzzStatusText">لقد ضغطت الجرس!</div>
    </div>

    <!-- Connection Status -->
    <div class="connection-status">
        <div class="status-dot connected" id="connectionStatus"></div>
        <div class="status-text" id="connectionText">متصل</div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        // Hex Pattern
        function drawHexPattern(svgEl) {
            const R=50, w=Math.sqrt(3)*R, h=2*R;
            const cols=Math.ceil(window.innerWidth/w)+2, rows=Math.ceil(window.innerHeight/(h*0.75))+2;
            let d='';
            for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
                const cx=c*w+(r%2===1?w/2:0), cy=r*h*0.75;
                let pts='';
                for(let i=0;i<6;i++) {
                    const a=Math.PI/180*(60*i-30);
                    pts+=(i===0?'M':'L')+(cx+R*Math.cos(a)).toFixed(1)+','+(cy+R*Math.sin(a)).toFixed(1);
                }
                d+=pts+'Z ';
            }
            const path=document.createElementNS('http://www.w3.org/2000/svg','path');
            path.setAttribute('d',d); path.setAttribute('fill','none');
            path.setAttribute('stroke','white'); path.setAttribute('stroke-width','2');
            svgEl.appendChild(path);
        }
        drawHexPattern(document.getElementById('hex-pattern-svg'));

        /* ===== SESSION MANAGEMENT ===== */
        const urlParams = new URLSearchParams(window.location.search);
        let sessionId = urlParams.get('session');
        if (!sessionId) {
            sessionId = Math.random().toString(36).substring(2, 11);
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?session=' + sessionId;
            window.history.replaceState({path:newUrl}, '', newUrl);
        }

        /* ===== Supabase Setup ===== */
        const supabaseUrl = 'https://rzblwgdvtiafqzhvcavr.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6Ymx3Z2R2dGlhZnF6aHZjYXZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMTMwMzcsImV4cCI6MjA5MTU4OTAzN30.Dy2ZkzPykeKs55ZVKw5wK_ghhBs8Ibk_-5IHfEJnPE0';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
        const channel = _supabase.channel('huroof_' + sessionId);
        
        channel
            .on('broadcast', { event: 'game_state' }, payload => {
                const state = payload.payload;
                if (state.settings) {
                    settings = state.settings;
                    updateLogoFromSettings();
                }
            })
            .on('broadcast', { event: 'reset_buzz' }, payload => {
                if (payload.payload.reset) {
                    resetBuzzer();
                }
            })
            .on('broadcast', { event: 'buzzer_locked' }, payload => {
                const lock = payload.payload;
                if (lock.locked && !isBuzzLocked && lock.playerName !== playerName) {
                    isBuzzLocked = true;
                    document.getElementById('buzzerBtn').style.opacity = '0.5';
                    document.getElementById('buzzerBtn').style.pointerEvents = 'none';
                }
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    channel.send({ type: 'broadcast', event: 'request_sync', payload: { timestamp: Date.now() } });
                }
            });

        // Player State
        let playerName = '', playerTeam = null, hasBuzzed = false, isBuzzLocked = false;
        let settings = { name: 'مراح', team1: 'الفريق الأول', team2: 'الفريق الثاني' };

        function updateLogoFromSettings() {
            document.getElementById('logoName').textContent = settings.name;
            document.getElementById('logoNameBuzzer').textContent = settings.name;
            document.getElementById('team1Name').textContent = settings.team1;
            document.getElementById('team2Name').textContent = settings.team2;
            if (playerTeam) {
                const teamName = playerTeam === 'green' ? settings.team1 : settings.team2;
                const teamDisplay = document.getElementById('display-team');
                if (teamDisplay) teamDisplay.textContent = teamName;
            }
        }

        function selectTeam(team) {
            playerTeam = team;
            document.getElementById('btn-green').classList.toggle('selected', team === 'green');
            document.getElementById('btn-orange').classList.toggle('selected', team === 'orange');
            validateForm();
        }

        function validateForm() {
            const name = document.getElementById('playerName').value.trim();
            document.getElementById('confirmBtn').disabled = !(name && playerTeam);
        }

        function confirmRegistration() {
            playerName = document.getElementById('playerName').value.trim();
            if (!playerName || !playerTeam) return;
            const teamName = playerTeam === 'green' ? settings.team1 : settings.team2;
            document.getElementById('screen-reg').classList.remove('active');
            document.getElementById('screen-buzzer').classList.add('active');
            document.getElementById('display-name').textContent = playerName;
            const teamDisplay = document.getElementById('display-team');
            teamDisplay.textContent = teamName;
            teamDisplay.className = 'player-team-display ' + playerTeam;
        }

        function pressBuzzer() {
            if (hasBuzzed || isBuzzLocked) return;
            hasBuzzed = true;
            document.getElementById('buzzerBtn').classList.add('pressed');
            playBell();
            showBuzzStatus();
            const teamName = playerTeam === 'green' ? settings.team1 : settings.team2;
            const buzzData = { name: playerName, team: playerTeam, teamName: teamName, timestamp: Date.now(), active: true };
            channel.send({ type: 'broadcast', event: 'player_buzz', payload: buzzData });
            channel.send({ type: 'broadcast', event: 'buzzer_locked', payload: { locked: true, playerName: playerName, teamName: teamName, timestamp: Date.now() } });
        }

        function resetBuzzer() {
            hasBuzzed = false; isBuzzLocked = false;
            const btn = document.getElementById('buzzerBtn');
            if (btn) { btn.classList.remove('pressed'); btn.style.opacity = ''; btn.style.pointerEvents = ''; }
            hideBuzzStatus();
        }

        function showBuzzStatus() {
            const status = document.getElementById('buzzStatus');
            const text = document.getElementById('buzzStatusText');
            const teamName = playerTeam === 'green' ? settings.team1 : settings.team2;
            text.textContent = playerName + ' - ' + teamName;
            status.classList.add('active');
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        function hideBuzzStatus() { document.getElementById('buzzStatus').classList.remove('active'); }

        function playBell() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.8, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0);
                osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 1.0);
            } catch (e) {}
        }

        function editPlayer() {
            if (!confirm('هل تريد تغيير معلومات اللاعب؟')) return;
            hasBuzzed = false; isBuzzLocked = false;
            document.getElementById('screen-buzzer').classList.remove('active');
            document.getElementById('screen-reg').classList.add('active');
        }

        setInterval(() => {
            const status = document.getElementById('connectionStatus');
            const text = document.getElementById('connectionText');
            if (channel && channel.state === 'joined') {
                status.classList.remove('disconnected'); status.classList.add('connected'); text.textContent = 'متصل';
            } else {
                status.classList.remove('connected'); status.classList.add('disconnected'); text.textContent = 'غير متصل';
            }
        }, 2000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شاشة اللاعب - حروف مع مراح</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script src="../firebase-config.js"></script>
    <style>
        @font-face {
            font-family: 'AA-GALAXY';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXY.otf');
        }
        @font-face {
            font-family: 'AA-GALAXY-BOLD';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXYBold.otf');
        }
        * {
            font-family: 'AA-GALAXY-BOLD', 'AA-GALAXY', sans-serif !important;
            box-sizing: border-box; margin: 0; padding: 0;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: #6a3093;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            gap: 15px;
            position: relative;
        }

        /* Hex Background */
        .hex-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #6a3093;
            overflow: hidden;
            z-index: 0;
        }
        .hex-bg svg {
            width: 100%;
            height: 100%;
            opacity: 0.18;
        }

        /* Screens */
        .screen {
            display: none;
            width: 100%;
            max-width: 500px;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 1;
        }
        .screen.active { display: flex; }

        /* Logo */
        .logo-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
            pointer-events: none;
        }
        .logo-word {
            font-weight: 900;
            text-align: center;
            display: inline-block;
        }
        .logo-huroof {
            color: #fdd835;
            font-size: clamp(32px, 7vw, 55px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 6px 6px 0 #2c1b4d,
                7px 7px 0 #2c1b4d, 8px 8px 0 #2c1b4d, 10px 10px 15px rgba(0,0,0,0.6);
        }
        .logo-ma {
            color: #26c6da;
            font-size: clamp(24px, 5vw, 42px);
            letter-spacing: clamp(5px, 1.2vw, 10px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 7px 7px 15px rgba(0,0,0,0.6);
        }
        .logo-marah {
            color: #ef5350;
            font-size: clamp(32px, 7vw, 55px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 6px 6px 0 #2c1b4d,
                7px 7px 0 #2c1b4d, 8px 8px 0 #2c1b4d, 10px 10px 15px rgba(0,0,0,0.6);
        }

        /* Registration Form */
        .reg-form {
            background: #2c1b4d;
            border-radius: 20px;
            padding: clamp(15px, 4vw, 25px);
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            color: #fdd835;
            font-size: clamp(14px, 3vw, 20px);
            font-weight: 900;
            text-align: center;
        }

        .name-input {
            width: 100%;
            padding: clamp(14px, 3vw, 20px);
            border: none;
            border-radius: 50px;
            background: white;
            color: #6a3093;
            font-size: clamp(16px, 4vw, 24px);
            font-weight: 900;
            text-align: center;
            outline: none;
        }

        /* Team Selection */
        .team-selection {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .team-btn {
            flex: 1;
            max-width: 160px;
            padding: clamp(16px, 4vw, 24px);
            border: none;
            border-radius: 18px;
            font-size: clamp(14px, 3.5vw, 20px);
            font-weight: 900;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            color: white;
        }

        .team-btn.green { background: #2ecc00; }
        .team-btn.orange { background: #ff6d00; }

        .team-btn.selected {
            background: #fdd835 !important;
            color: #2c1b4d !important;
            box-shadow: 0 0 0 4px white, 0 8px 25px rgba(253,216,53,0.5) !important;
            transform: scale(1.05);
        }

        /* Confirm Button */
        .confirm-btn {
            width: 100%;
            padding: clamp(16px, 4vw, 22px);
            border: none;
            border-radius: 50px;
            background: linear-gradient(90deg, #B366FF, #FF5599);
            color: white;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transition: all 0.2s;
            margin-top: 10px;
        }
        .confirm-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Buzzer Screen */
        .buzzer-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            flex: 1;
        }

        .player-info {
            background: #2c1b4d;
            border-radius: 18px;
            padding: clamp(15px, 4vw, 25px);
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .player-name-display { font-size: clamp(22px, 5vw, 32px); font-weight: 900; color: white; }

        .player-team-display {
            font-size: clamp(16px, 3.5vw, 22px); font-weight: 900;
            padding: 6px 20px; border-radius: 25px; color: white;
        }
        .player-team-display.green { background: #2ecc00; }
        .player-team-display.orange { background: #ff6d00; }

        /* Buzzer Button */
        .buzzer-btn {
            width: clamp(160px, 45vw, 240px);
            height: clamp(160px, 45vw, 240px);
            border: none;
            border-radius: 50%;
            background: linear-gradient(145deg, #ef5350, #c62828);
            color: white;
            font-size: clamp(28px, 8vw, 42px);
            font-weight: 900;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 -6px 15px rgba(0,0,0,0.3);
            transition: all 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .buzzer-btn:active:not(:disabled) {
            transform: scale(0.92);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 6px 15px rgba(0,0,0,0.3);
        }

        .buzzer-btn:disabled {
            background: #444;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .buzzer-btn.locked {
            background: #2c1b4d;
            border: 4px solid #fdd835;
            color: #fdd835;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(253,216,53,0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(253,216,53,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(253,216,53,0); }
        }

        .status-text {
            color: white; font-size: 18px; font-weight: 700; opacity: 0.8;
            text-align: center; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="hex-bg">
        <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
            <pattern id="hexagons" width="10" height="17.32" patternUnits="userSpaceOnUse" patternTransform="scale(1.2)">
                <path d="M5 0 L10 2.88 L10 8.66 L5 11.54 L0 8.66 L0 2.88 Z" fill="none" stroke="currentColor" stroke-width="0.15" />
            </pattern>
            <rect width="100%" height="100%" fill="url(#hexagons)" />
        </svg>
    </div>

    <!-- Screen 1: Registration -->
    <div id="regScreen" class="screen active">
        <div class="logo-stack">
            <span class="logo-word logo-huroof">حروف</span>
            <span class="logo-word logo-ma">مـع</span>
            <span class="logo-word logo-marah" id="logoName">مراح</span>
        </div>
        <div class="reg-form">
            <div class="input-group">
                <div class="input-label">أدخل اسمك</div>
                <input type="text" id="playerName" class="name-input" placeholder="اكتب اسمك هنا..." maxlength="15">
            </div>
            <div class="input-group">
                <div class="input-label">اختر فريقك</div>
                <div class="team-selection">
                    <button class="team-btn green" id="teamGreen" onclick="selectTeam('green')">
                        <span class="team-icon">🟢</span>
                        <span id="team1Name">الفريق الأول</span>
                    </button>
                    <button class="team-btn orange" id="teamOrange" onclick="selectTeam('orange')">
                        <span class="team-icon">🟠</span>
                        <span id="team2Name">الفريق الثاني</span>
                    </button>
                </div>
            </div>
            <button class="confirm-btn" id="confirmBtn" onclick="confirmReg()" disabled>دخول اللعبة</button>
        </div>
    </div>

    <!-- Screen 2: Buzzer -->
    <div id="buzzerScreen" class="screen">
        <div class="player-info">
            <div class="player-name-display" id="displayName">اللاعب</div>
            <div class="player-team-display" id="displayTeam">الفريق</div>
        </div>
        <div class="buzzer-screen">
            <button class="buzzer-btn" id="buzzerBtn" onclick="buzz()">
                <span>🔔</span>
                <span>اضغط!</span>
            </button>
            <div class="status-text" id="statusText">انتظر سؤال المقدم...</div>
        </div>
    </div>

    <script>
        const sessionId = new URLSearchParams(window.location.search).get('session');
        if (!sessionId) alert('خطأ: لا يوجد معرف للجلسة.');

        let player = { name: '', team: '', teamName: '' };
        let isLocked = false;

        function selectTeam(team) {
            player.team = team;
            player.teamName = document.getElementById(team === 'green' ? 'team1Name' : 'team2Name').textContent;
            document.getElementById('teamGreen').classList.toggle('selected', team === 'green');
            document.getElementById('teamOrange').classList.toggle('selected', team === 'orange');
            checkForm();
        }

        document.getElementById('playerName').addEventListener('input', checkForm);
        function checkForm() {
            const name = document.getElementById('playerName').value.trim();
            document.getElementById('confirmBtn').disabled = !(name && player.team);
        }

        function confirmReg() {
            player.name = document.getElementById('playerName').value.trim();
            document.getElementById('regScreen').classList.remove('active');
            document.getElementById('buzzerScreen').classList.add('active');
            document.getElementById('displayName').textContent = player.name;
            document.getElementById('displayTeam').textContent = player.teamName;
            document.getElementById('displayTeam').className = 'player-team-display ' + player.team;
        }

        function buzz() {
            if (isLocked) return;
            const buzzData = { name: player.name, team: player.team, teamName: player.teamName, timestamp: Date.now(), active: true };
            firebaseUpdate('games/' + sessionId + '/playerBuzz', buzzData);
            firebaseUpdate('games/' + sessionId + '/buzzerLocked', { locked: true, playerName: player.name, teamName: player.teamName, timestamp: Date.now() });
            lockBuzzer();
        }

        function lockBuzzer() {
            isLocked = true;
            const btn = document.getElementById('buzzerBtn');
            btn.classList.add('locked');
            btn.disabled = true;
            document.getElementById('statusText').textContent = 'تم إرسال الإشارة!';
        }

        function unlockBuzzer() {
            isLocked = false;
            const btn = document.getElementById('buzzerBtn');
            btn.classList.remove('locked');
            btn.disabled = false;
            document.getElementById('statusText').textContent = 'جاهز للضغط!';
        }

        // Firebase Listeners
        firebaseListener('games/' + sessionId + '/settings', (s) => {
            if (s) {
                document.getElementById('logoName').textContent = s.name;
                document.getElementById('team1Name').textContent = s.team1;
                document.getElementById('team2Name').textContent = s.team2;
                if (player.team) player.teamName = (player.team === 'green' ? s.team1 : s.team2);
            }
        });

        firebaseListener('games/' + sessionId + '/resetBuzz', (data) => {
            if (data && data.reset) unlockBuzzer();
        });

        firebaseListener('games/' + sessionId + '/buzzerLocked', (lock) => {
            if (lock && lock.locked && lock.playerName !== player.name) {
                isLocked = true;
                document.getElementById('buzzerBtn').disabled = true;
                document.getElementById('statusText').textContent = 'لاعب آخر ضغط أولاً!';
            }
        });
    </script>
</body>
</html>

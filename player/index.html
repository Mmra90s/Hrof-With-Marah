<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شاشة اللاعب - حروف مع مراح</title>
    <style>
        @font-face {
            font-family: 'AA-GALAXY';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXY.otf' );
        }
        @font-face {
            font-family: 'AA-GALAXY-BOLD';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXYBold.otf' );
        }
        :root {
            /* ألوان ثابتة لمنع التضارب */
            --team1-color: #2ecc00;
            --team2-color: #ff6d00;
        }
        * {
            font-family: 'AA-GALAXY-BOLD', 'AA-GALAXY', sans-serif !important;
            box-sizing: border-box; margin: 0; padding: 0;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        body {
            background: #6a3093;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            padding-top: max(15px, env(safe-area-inset-top));
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            gap: 15px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Hex Background */
        .hex-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #6a3093;
            overflow: hidden;
            z-index: 0;
        }
        .hex-bg svg {
            width: 100%;
            height: 100%;
            opacity: 0.18;
        }

        /* Fullscreen Button */
        .fullscreen-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 1000;
            width: 40px;
            height: 40px;
            background: rgba(44, 27, 77, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .fullscreen-btn:hover {
            background: rgba(44, 27, 77, 0.9);
            transform: scale(1.05);
        }
        .fullscreen-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Screens */
        .screen {
            display: none;
            width: 100%;
            max-width: 500px;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }
        .screen.active { display: flex; }

        /* Logo */
        .logo-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
            pointer-events: none;
            flex-shrink: 0;
        }
        .logo-word {
            font-weight: 900;
            text-align: center;
            display: inline-block;
        }
        .logo-huroof {
            color: #fdd835;
            font-size: clamp(32px, 7vw, 55px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 6px 6px 0 #2c1b4d,
                7px 7px 0 #2c1b4d, 8px 8px 0 #2c1b4d, 10px 10px 15px rgba(0,0,0,0.6);
        }
        .logo-ma {
            color: #26c6da;
            font-size: clamp(24px, 5vw, 42px);
            letter-spacing: clamp(5px, 1.2vw, 10px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 7px 7px 15px rgba(0,0,0,0.6);
        }
        .logo-marah {
            color: #ef5350;
            font-size: clamp(32px, 7vw, 55px);
            text-shadow: 1px 1px 0 #2c1b4d, 2px 2px 0 #2c1b4d, 3px 3px 0 #2c1b4d,
                4px 4px 0 #2c1b4d, 5px 5px 0 #2c1b4d, 6px 6px 0 #2c1b4d,
                7px 7px 0 #2c1b4d, 8px 8px 0 #2c1b4d, 10px 10px 15px rgba(0,0,0,0.6);
        }

        /* Player Label */
        .player-label {
            color: white;
            font-size: clamp(14px, 3.5vw, 22px);
            font-weight: 900;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            text-align: center;
        }

        /* Registration Form */
        .reg-form {
            background: #2c1b4d;
            border-radius: 20px;
            padding: clamp(15px, 4vw, 25px);
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            color: #fdd835;
            font-size: clamp(14px, 3vw, 20px);
            font-weight: 900;
            text-align: center;
        }

        .name-input {
            width: 100%;
            padding: clamp(14px, 3vw, 20px);
            border: none;
            border-radius: 50px;
            background: white;
            color: #6a3093;
            font-size: clamp(16px, 4vw, 24px);
            font-weight: 900;
            text-align: center;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .name-input::placeholder {
            color: #b39ddb;
            font-size: clamp(14px, 3vw, 18px);
        }
        .name-input:focus {
            box-shadow: 0 0 0 4px #fdd835, 0 4px 20px rgba(253,216,53,0.4);
        }

        /* Team Selection */
        .team-selection {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .team-btn {
            flex: 1;
            max-width: 160px;
            padding: clamp(16px, 4vw, 24px);
            border: none;
            border-radius: 18px;
            font-size: clamp(14px, 3.5vw, 20px);
            font-weight: 900;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            color: white;
        }

        .team-btn.green {
            background: var(--team1-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .team-btn.orange {
            background: var(--team2-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .team-btn:hover:not(.selected) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .team-btn.selected {
            background: #fdd835 !important;
            color: #2c1b4d !important;
            box-shadow: 0 0 0 4px white, 0 8px 25px rgba(253,216,53,0.5) !important;
            transform: scale(1.05);
        }

        .team-icon {
            font-size: clamp(28px, 6vw, 40px);
        }

        /* Confirm Button */
        .confirm-btn {
            width: 100%;
            padding: clamp(16px, 4vw, 22px);
            border: none;
            border-radius: 50px;
            background: linear-gradient(90deg, #B366FF, #FF5599);
            color: white;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transition: all 0.2s;
            margin-top: 10px;
        }
        .confirm-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .confirm-btn:active:not(:disabled) {
            transform: translateY(1px);
        }
        .confirm-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Buzzer Screen */
        .buzzer-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            min-height: 0;
            flex: 1;
            padding-bottom: 20px;
        }

        .player-info {
            background: #2c1b4d;
            border-radius: 18px;
            padding: clamp(15px, 4vw, 25px);
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }

        .player-name-display {
            font-size: clamp(22px, 5vw, 32px);
            font-weight: 900;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .player-team-display {
            font-size: clamp(16px, 3.5vw, 22px);
            font-weight: 900;
            padding: 6px 20px;
            border-radius: 25px;
            color: white;
        }
        .player-team-display.green {
            background: var(--team1-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .player-team-display.orange {
            background: var(--team2-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Buzzer Button */
        .buzzer-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
        }

        .buzzer-btn {
            width: clamp(160px, 40vw, 220px);
            height: clamp(160px, 40vw, 220px);
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at 30% 30%, #ff5252, #b71c1c);
            color: white;
            font-size: clamp(20px, 5vw, 28px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 15px 0 #880e4f, 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.1s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .buzzer-btn:active, .buzzer-btn.pressed {
            transform: translateY(10px);
            box-shadow: 0 5px 0 #880e4f, 0 10px 20px rgba(0,0,0,0.5);
            background: radial-gradient(circle at 30% 30%, #d32f2f, #8e0000);
        }

        .edit-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .edit-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px);
        }
        .edit-btn:active {
            transform: translateY(0);
        }
        .edit-btn i {
            font-size: clamp(14px, 3.5vw, 18px);
        }

        @keyframes buzzerPulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .buzzer-icon {
            font-size: clamp(40px, 10vw, 60px);
        }

        /* Buzz Status */
        .buzz-status {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
        }
        .buzz-status.active {
            display: flex;
        }
        .buzz-status-bg {
            position: absolute;
            inset: 0;
            background: rgba(253, 216, 53, 0.3);
            animation: flashBg 0.5s ease-out;
        }
        @keyframes flashBg {
            0% { background: rgba(253, 216, 53, 0.6); }
            100% { background: rgba(253, 216, 53, 0); }
        }
        .buzz-status-text {
            font-size: clamp(32px, 8vw, 50px);
            font-weight: 900;
            color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Animations */
        @keyframes floatUp {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes glow-yellow {
            0%,100% { filter: drop-shadow(0 0 4px rgba(253,216,53,0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(253,216,53,1)) drop-shadow(0 0 36px rgba(253,216,53,0.6)); }
        }
        @keyframes glow-cyan {
            0%,100% { filter: drop-shadow(0 0 4px rgba(38,198,218,0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(38,198,218,1)) drop-shadow(0 0 36px rgba(38,198,218,0.6)); }
        }
        @keyframes glow-red {
            0%,100% { filter: drop-shadow(0 0 4px rgba(239,83,80,0.3)); }
            50% { filter: drop-shadow(0 0 16px rgba(239,83,80,1)) drop-shadow(0 0 36px rgba(239,83,80,0.6)); }
        }

        .logo-huroof { animation: floatUp 4s ease-in-out infinite, glow-yellow 4s ease-in-out infinite; }
        .logo-ma { animation: floatUp 4s ease-in-out 0.5s infinite, glow-cyan 4s ease-in-out 0.5s infinite; }
        .logo-marah { animation: floatUp 4s ease-in-out 1s infinite, glow-red 4s ease-in-out 1s infinite; }

        /* Responsive */
        @media (max-height: 650px) and (orientation: portrait) {
            html, body { overflow-y: auto; }
            .screen { gap: 10px; }
            .reg-form { padding: 12px; gap: 10px; }
            .buzzer-btn { width: 120px; height: 120px; font-size: 18px; }
            .buzzer-icon { font-size: 35px; }
            .logo-stack { transform: scale(0.7); }
            .buzzer-screen { gap: 12px; }
        }

        @media (max-width: 360px) {
            .team-btn { padding: 10px; }
            .buzzer-btn { width: 120px; height: 120px; }
        }

        @media (max-height: 500px) {
            .logo-stack { display: none; }
            .player-label { display: none; }
            .buzzer-btn { width: 100px; height: 100px; }
            .buzzer-icon { font-size: 30px; }
        }
    </style>
</head>
<body>
    <button class="fullscreen-btn" id="fullscreen-btn" title="ملء الشاشة">
        <svg viewBox="0 0 24 24" id="fullscreen-icon">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
    </button>
    <!-- Hex Background -->
    <div class="hex-bg">
        <svg xmlns="http://www.w3.org/2000/svg" id="hex-pattern-svg"></svg>
    </div>

    <!-- Registration Screen -->
    <div class="screen active" id="screen-reg">
        <div class="logo-stack">
            <span class="logo-word logo-huroof">حروف</span>
            <span class="logo-word logo-ma">مع</span>
            <span class="logo-word logo-marah" id="logoName">مراح</span>
        </div>

        <div class="player-label">شاشة اللاعب</div>

        <div class="reg-form">
            <div class="input-group">
                <label class="input-label">اسمك</label>
                <input
                    type="text"
                    class="name-input"
                    id="playerName"
                    placeholder="اكتب اسمك هنا..."
                    maxlength="20"
                    autocomplete="off"
                >
            </div>

            <div class="input-group">
                <label class="input-label">اختر فريقك</label>
                <div class="team-selection">
                    <button class="team-btn green" id="btn-green" onclick="selectTeam('green' )">
                        <span class="team-icon">🚩</span>
                        <span class="team-name">أخضر</span>
                    </button>
                    <button class="team-btn orange" id="btn-orange" onclick="selectTeam('orange')">
                        <span class="team-icon">🚩</span>
                        <span class="team-name">برتقالي</span>
                    </button>
                </div>
            </div>

            <button class="confirm-btn" id="confirmBtn" onclick="confirmRegistration()" disabled>
                تأكيد الدخول
            </button>
        </div>
    </div>

    <!-- Buzzer Screen -->
    <div class="screen" id="screen-buzzer">
        <div class="buzzer-screen">
            <div class="logo-stack" style="transform: scale(0.6); flex-shrink: 0;">
                <span class="logo-word logo-huroof">حروف</span>
                <span class="logo-word logo-ma">مع</span>
                <span class="logo-word logo-marah" id="logoName2">مراح</span>
            </div>

            <div class="player-info">
                <div class="player-name-display" id="display-name"></div>
                <div class="player-team-display" id="display-team"></div>
                <button class="edit-btn" id="editBtn" onclick="editPlayer()">
                    <span>✏️</span>
                    <span>تغيير الاسم أو الفريق</span>
                </button>
            </div>

            <div class="buzzer-container">
                <button class="buzzer-btn" id="buzzerBtn" onclick="pressBuzzer()">
                    <span class="buzzer-icon">🔔</span>
                    <span>BUZZER</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Buzz Status Overlay -->
    <div class="buzz-status" id="buzzStatus">
        <div class="buzz-status-bg"></div>
        <div class="buzz-status-text" id="buzzStatusText"></div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script type="module">
    /* ===== FIREBASE CONFIG ===== */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAEkMA_InJKZc52yrjv9Ql59hmPMGgTI90",
        authDomain: "hrof-with-marah-bb9bc.firebaseapp.com",
        databaseURL: "https://hrof-with-marah-bb9bc-default-rtdb.firebaseio.com",
        projectId: "hrof-with-marah-bb9bc",
        storageBucket: "hrof-with-marah-bb9bc.firebasestorage.app",
        messagingSenderId: "840796662556",
        appId: "1:840796662556:web:35298933d2c9af738168d9"
    };
    const fbApp = initializeApp(firebaseConfig );
    const db = getDatabase(fbApp);

    /* ===== HEX PATTERN ===== */
    function drawHexPattern(svgEl) {
        const R = 50, w = Math.sqrt(3)*R, h = 2*R;
        const cols = Math.ceil(window.innerWidth/w)+2;
        const rows = Math.ceil(window.innerHeight/(h*0.75))+2;
        let d = '';
        for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) {
            const cx = c*w+(r%2===1?w/2:0), cy = r*h*0.75;
            let pts='';
            for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);pts+=(i===0?'M':'L')+(cx+R*Math.cos(a)).toFixed(1)+','+(cy+R*Math.sin(a)).toFixed(1);}
            d+=pts+'Z ';
        }
        const path=document.createElementNS('http://www.w3.org/2000/svg','path' );
        path.setAttribute('d',d); path.setAttribute('fill','none');
        path.setAttribute('stroke','white'); path.setAttribute('stroke-width','2');
        svgEl.appendChild(path);
    }
    drawHexPattern(document.getElementById('hex-pattern-svg'));

    /* ===== SESSION MANAGEMENT ===== */
    const urlParams = new URLSearchParams(window.location.search);
    let sessionId = urlParams.get('session') || 'default';

    /* ===== FIREBASE REFS ===== */
    const settingsRef  = () => ref(db, 'sessions/' + sessionId + '/settings');
    const buzzRef      = () => ref(db, 'sessions/' + sessionId + '/buzz');
    const buzzResetRef = () => ref(db, 'sessions/' + sessionId + '/buzzReset');
    const buzzLockRef  = () => ref(db, 'sessions/' + sessionId + '/buzzLock');

    /* ===== PLAYER STATE ===== */
    let playerName = '';
    let playerTeam = null;
    let hasBuzzed = false;
    let isBuzzLocked = false;

    let settings = { name:'مراح', team1:'الفريق الأول', team2:'الفريق الثاني', rounds:2, colors: { t1: '#2ecc00', t2: '#ff6d00' } };

    /* ===== SETTINGS SYNC ===== */
    function updateLogoFromSettings() {
        document.getElementById('logoName').textContent = settings.name;
        const logo2 = document.getElementById('logoName2');
        if (logo2) logo2.textContent = settings.name;
        document.getElementById('btn-green').querySelector('.team-name').textContent = settings.team1;
        document.getElementById('btn-orange').querySelector('.team-name').textContent = settings.team2;

        // تحديث ألوان التصميم باستخدام المتغيرات لضمان المرونة
        if (settings.colors) {
            document.documentElement.style.setProperty('--team1-color', settings.colors.t1);
            document.documentElement.style.setProperty('--team2-color', settings.colors.t2);
        }
    }

    // Listen for settings from Firebase (real-time)
    onValue(settingsRef(), (snapshot) => {
        if (!snapshot.exists()) return;
        const newSettings = snapshot.val();
        if (!newSettings) return;
        if (JSON.stringify(newSettings) !== JSON.stringify(settings)) {
            settings = { ...settings, ...newSettings };
            updateLogoFromSettings();
        }
    });

    /* ===== TEAM SELECTION ===== */
    function selectTeam(team) {
        playerTeam = team;
        document.getElementById('btn-green').classList.toggle('selected', team === 'green');
        document.getElementById('btn-orange').classList.toggle('selected', team === 'orange');
        checkCanConfirm();
    }

    function checkCanConfirm() {
        const name = document.getElementById('playerName').value.trim();
        const canConfirm = name.length > 0 && playerTeam !== null;
        document.getElementById('confirmBtn').disabled = !canConfirm;
    }

    document.getElementById('playerName').addEventListener('input', checkCanConfirm);
    document.getElementById('playerName').addEventListener('change', checkCanConfirm);

    /* ===== REGISTRATION ===== */
    function confirmRegistration() {
        playerName = document.getElementById('playerName').value.trim();
        if (!playerName || !playerTeam) return;
        const teamName = playerTeam === 'green' ? settings.team1 : settings.team2;
        document.getElementById('screen-reg').classList.remove('active');
        document.getElementById('screen-buzzer').classList.add('active');
        document.getElementById('display-name').textContent = playerName;
        const teamDisplay = document.getElementById('display-team');
        teamDisplay.textContent = teamName;
        teamDisplay.className = 'player-team-display ' + playerTeam;
    }

    /* ===== BUZZER ===== */
    function pressBuzzer() {
        if (hasBuzzed || isBuzzLocked) return;
        
        // منع الضغط المتكرر فوراً محلياً
        hasBuzzed = true;
        isBuzzLocked = true;

        const btn = document.getElementById('buzzerBtn');
        btn.classList.add('pressed');
        btn.style.opacity = '0.5';
        btn.style.pointerEvents = 'none';

        playBell();
        
        const teamName = playerTeam === 'green' ? settings.team1 : settings.team2;
        const ts = Date.now();

        // بيانات موحدة لجميع الشاشات
        const buzzData = { 
            name: playerName, 
            team: playerTeam, 
            teamName: teamName, 
            timestamp: ts, 
            active: true 
        };

        // إرسال البيانات فوراً لضمان التزامن اللحظي
        set(buzzRef(), buzzData);
        set(buzzLockRef(), { locked: true, ...buzzData });
        
        showBuzzStatus();
    }

    // Listen for buzz lock from Firebase (another player buzzed)
    onValue(buzzLockRef(), (snapshot) => {
        if (!snapshot.exists()) {
            if (isBuzzLocked || hasBuzzed) {
                isBuzzLocked = false;
                const btn = document.getElementById('buzzerBtn');
                btn.style.opacity = '';
                btn.style.pointerEvents = '';
            }
            return;
        }
        const lock = snapshot.val();
        if (!lock || !lock.locked) return;
        if (lock.playerName !== playerName && !isBuzzLocked) {
            isBuzzLocked = true;
            const btn = document.getElementById('buzzerBtn');
            btn.style.opacity = '0.5';
            btn.style.pointerEvents = 'none';
        }
    });

    onValue(buzzResetRef(), (snapshot) => {
        if (!snapshot.exists()) return;
        const reset = snapshot.val();
        if (reset && reset.reset) resetBuzzer();
    });

    function resetBuzzer() {
        hasBuzzed = false;
        isBuzzLocked = false;
        const btn = document.getElementById('buzzerBtn');
        btn.classList.remove('pressed');
        btn.style.opacity = '';
        btn.style.pointerEvents = '';
        hideBuzzStatus();
    }

    function showBuzzStatus() {
        const status = document.getElementById('buzzStatus');
        const text = document.getElementById('buzzStatusText');
        const teamName = playerTeam === 'green' ? settings.team1 : settings.team2;
        // إظهار اسم الفريق فقط لمنع التضارب كما طلب المستخدم
        text.textContent = teamName;
        status.classList.add('active');
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }

    function hideBuzzStatus() {
        document.getElementById('buzzStatus').classList.remove('active');
    }

    function playBell() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.8, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 1.0);
        } catch(e) {}
    }

    /* ===== EDIT / RESET PLAYER ===== */
    window.selectTeam = selectTeam;
    window.confirmRegistration = confirmRegistration;
    window.pressBuzzer = pressBuzzer;
    window.editPlayer = function() {
        remove(buzzRef());
        hasBuzzed = false;
        document.getElementById('buzzerBtn').classList.remove('pressed');
        document.getElementById('playerName').value = playerName;
        if (playerTeam) selectTeam(playerTeam);
        document.getElementById('screen-buzzer').classList.remove('active');
        document.getElementById('screen-reg').classList.add('active');
    };

    /* ===== FULLSCREEN ===== */
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const fullscreenIcon = document.getElementById('fullscreen-icon');
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.error(err.message));
        } else {
            document.exitFullscreen();
        }
    });
    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            fullscreenIcon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
        } else {
            fullscreenIcon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
        }
    });
    </script>
</body>
</html>

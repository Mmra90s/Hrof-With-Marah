<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الاشتراك - حروف مع مراح</title>
    
    <!-- Firebase SDKs (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        @font-face {
            font-family: 'AA-GALAXY';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXY.otf');
        }
        @font-face {
            font-family: 'AA-GALAXY-BOLD';
            src: url('https://arbfonts.com//wp-content/fonts/new-arabic-fonts//AA-GALAXYBold.otf');
        }
        * {
            font-family: 'AA-GALAXY-BOLD', 'AA-GALAXY', sans-serif !important;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #6a3093;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 450px;
        }
        h1 { font-size: 32px; margin-bottom: 20px; color: #f1c40f; }
        p { margin-bottom: 30px; opacity: 0.8; }
        input {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: none;
            margin-bottom: 20px;
            font-size: 18px;
            text-align: center;
            outline: none;
        }
        button {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: none;
            background: #f1c40f;
            color: #6a3093;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        .error { color: #ef5350; margin-top: 15px; display: none; }
        .success { color: #2ecc00; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>تحقق من الاشتراك</h1>
    <p>يرجى إدخال رقم الهاتف المسجل لتفعيل اللعبة</p>
    <input type="tel" id="phoneInput" placeholder="أدخل رقم الهاتف">
    <button onclick="handleVerify()">تحقق الآن</button>
    <div id="errorMsg" class="error">رقم الهاتف غير مسجل أو حدث خطأ</div>
    <div id="successMsg" class="success">تم التحقق بنجاح! جاري التحويل...</div>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAj--jlVnbBRJgW2jPKN_eyXPaxdD_E08I",
        authDomain: "verification-da042.firebaseapp.com",
        projectId: "verification-da042",
        storageBucket: "verification-da042.firebasestorage.app",
        messagingSenderId: "401133990090",
        appId: "1:401133990090:web:5856ce77e2c21fbc6e8433"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function handleVerify() {
        const input = document.getElementById('phoneInput').value;
        const errorEl = document.getElementById('errorMsg');
        const successEl = document.getElementById('successMsg');
        
        errorEl.style.display = 'none';
        successEl.style.display = 'none';

        // تنظيف الرقم وأخذ آخر 6 أرقام
        const cleanPhone = input.replace(/\D/g, '');
        if (cleanPhone.length < 6) {
            errorEl.textContent = "يرجى إدخال رقم هاتف صحيح";
            errorEl.style.display = 'block';
            return;
        }
        const suffix = cleanPhone.slice(-6);

        console.log("DEBUG: Cleaning phone number:", cleanPhone);
        console.log("DEBUG: Looking for suffix:", suffix);

        try {
            // البحث عن الوثيقة التي يكون الـ ID الخاص بها هو الرقم كاملاً
            // سنقوم بتجربة جلب الوثيقة مباشرة إذا كان المستخدم أدخل الرقم كاملاً
            // أو البحث عن وثيقة تنتهي بآخر 6 أرقام
            
            console.log("DEBUG: Attempting to fetch document from 'buyers' collection...");
            
            // الطريقة الأولى: جلب الوثيقة بالرقم كما أدخله المستخدم (بعد التنظيف)
            const docRef = db.collection('buyers').doc(cleanPhone);
            const doc = await docRef.get();

            if (doc.exists) {
                console.log("DEBUG: Document found by full number!");
                proceedSuccess();
            } else {
                console.log("DEBUG: Document not found by full number. Checking other possibilities...");
                // إذا لم يجد الرقم كاملاً، سنبحث في كل الوثائق (يتطلب قواعد أمان تسمح بالـ list)
                // ولكن بما أننا نريد أماناً عالياً، سنطلب من المستخدم إدخال الرقم كما هو في الداتا بيس
                errorEl.textContent = "رقم الهاتف غير مسجل في النظام";
                errorEl.style.display = 'block';
            }
        } catch (error) {
            console.error("DEBUG ERROR:", error);
            console.error("DEBUG ERROR CODE:", error.code);
            console.error("DEBUG ERROR MESSAGE:", error.message);
            
            if (error.code === 'permission-denied') {
                errorEl.textContent = "خطأ في صلاحيات Firebase. تأكد من قواعد الأمان (Rules).";
            } else {
                errorEl.textContent = "حدث خطأ أثناء الاتصال بـ Firebase: " + error.message;
            }
            errorEl.style.display = 'block';
        }
    }

    function proceedSuccess() {
        const successEl = document.getElementById('successMsg');
        successEl.style.display = 'block';
        
        // تعيين الكوكي لمدة 7 أيام
        const d = new Date();
        d.setTime(d.getTime() + (7 * 24 * 60 * 60 * 1000));
        document.cookie = "game_verified=true; expires=" + d.toUTCString() + "; path=/";
        
        setTimeout(() => {
            window.location.href = '../index.html';
        }, 2000);
    }
</script>

</body>
</html>
